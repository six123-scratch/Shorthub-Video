<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ShortVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 1. NAVBAR */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 19px; color: #fff; cursor: pointer;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 4px 8px; border-radius: 8px; display: flex; align-items: center;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .avatar-badge {
      display: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      background-color: #00bcd4; color: #000; align-items: center; justify-content: center; font-weight: bold;
      background-size: cover; background-position: center;
    }
    .delete-video { position:absolute; top:14px; right:14px; z-index:8; border:0; border-radius:16px; padding:7px 10px; background:rgba(0,0,0,.75); color:#fff; cursor:pointer; }

    /* 2. LAYOUT */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* SIDEBAR KIRI: HANYA ICON MAIN & SHORTS (VEKTOR SVG) */
    .sidebar {
      width: 76px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      gap: 20px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 11px; color: #aaa; cursor: pointer; width: 100%; padding: 8px 0;
    }
    .side-item:hover, .side-item.active { color: #fff; font-weight: bold; }
    .side-item.active svg { fill: #ff0000; }
    .side-icon-svg { width: 24px; height: 24px; fill: #ffffff; }

    /* ================= HALAMAN MAIN ================= */
    #page-main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .main-title {
      font-size: 36px;
      font-weight: bold;
      margin-bottom: 25px;
      color: #ffffff;
    }
    .main-buttons-group {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .btn-main-action {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 25px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-main-play { background-color: #ff0000; color: white; }
    .btn-main-play:hover { background-color: #cc0000; transform: scale(1.05); }
    .btn-main-add { background-color: #272727; color: white; }
    .btn-main-add:hover { background-color: #3f3f3f; transform: scale(1.05); }

    /* ================= HALAMAN SHORTS ================= */
    #page-shorts {
      display: none; /* Awalnya sembunyi */
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #page-shorts::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .video-frame {
      height: 88vh;
      max-height: 720px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Overlay Channel & Subscribe */
    .channel-overlay {
      position: absolute;
      bottom: 20px; left: 15px; right: 15px;
      color: white; z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 36px; height: 36px; border-radius: 50%; background: #ff5722;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Tombol Samping (Like dari 0, Komen, Share) */
    .actions-bar {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      width: 48px; height: 48px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .action-btn:hover { background: #3f3f3f; }
    .action-btn.active svg { fill: #ff0000; }
    .action-btn svg { width: 22px; height: 22px; fill: #ffffff; }
    .action-label { font-size: 12px; margin-top: 2px; }

    /* Drawer Komentar */
    .comment-drawer {
      display: none; position: fixed; right: 0; bottom: 0;
      width: 360px; height: calc(100vh - 56px); background: #181818;
      border-left: 1px solid #303030; z-index: 90;
      flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .comment-header {
      padding: 16px; border-bottom: 1px solid #303030;
      display: flex; justify-content: space-between; align-items: center; font-weight: bold;
    }
    .comment-list {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .comment-item { font-size: 13px; background: #222; padding: 10px; border-radius: 8px; }
    .comment-input-area {
      padding: 12px; border-top: 1px solid #303030; display: flex; gap: 8px;
    }
    .comment-input-area input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #444;
      background: #121212; color: white; outline: none;
    }
    .comment-input-area button {
      background: #ff0000; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-box input {
      padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="brand-logo" onclick="bukaHalaman('main')">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </span>
      ShortVideo
    </div>
    <div class="header-right">
      <button type="button" class="btn-create" onclick="document.getElementById('add-modal').style.display='flex'">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModal('auth-modal')">Buat Akun</button>
      <div class="avatar-badge" id="user-badge" onclick="bukaModal('auth-modal')">U</div>
    </div>
  </header>

  <!-- LAYOUT UTAMA -->
  <div class="main-layout">
    
    <!-- SIDEBAR KIRI: HANYA ICON MAIN & SHORTS (VEKTOR SVG) -->
    <div class="sidebar">
      <!-- Icon Main -->
      <div class="side-item active" id="side-main" onclick="bukaHalaman('main')">
        <svg class="side-icon-svg" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        Main
      </div>
      <!-- Icon Shorts -->
      <div class="side-item" id="side-shorts" onclick="bukaHalaman('shorts')">
        <svg class="side-icon-svg" viewBox="0 0 24 24">
          <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        </svg>
        Shorts
      </div>
      <div class="side-item" id="side-my-videos" onclick="tampilkanVideoSaya()">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h10v4H4v-4z"/></svg>
        Uploadanku
      </div>
    </div>

    <!-- 1. HALAMAN MAIN -->
    <div id="page-main">
      <div class="main-title">Nonton Short apa?</div>
      <div class="main-buttons-group">
        <button class="btn-main-action btn-main-play" onclick="bukaHalaman('shorts')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          Nonton Shorts
        </button>
        <button type="button" class="btn-main-action btn-main-add" onclick="document.getElementById('add-modal').style.display='flex'">
          ＋ Tambahkan Short
        </button>
      </div>
      <p id="empty-info" style="color: #777; margin-top: 25px; font-size: 14px;">Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!</p>
    </div>

    <!-- 2. HALAMAN SHORTS -->
    <div id="page-shorts">
      <!-- Video akan otomatis masuk ke sini lewat JavaScript -->
    </div>

  </div>

  <!-- PANEL KOMENTAR -->
  <div class="comment-drawer" id="comment-drawer">
    <div class="comment-header">
      <span id="comment-title">Komentar</span>
      <button style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;" onclick="tutupKomentar()">✕</button>
    </div>
    <div class="comment-list" id="comment-list"></div>
    <div class="comment-input-area">
      <input type="text" id="input-komentar" placeholder="Tulis komentar kamu...">
      <button onclick="kirimKomentar()">Kirim</button>
    </div>
  </div>

  <!-- POPUP BUAT AKUN -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3>Akun ShortVideo</h3>
      <input type="text" id="username-input" placeholder="Nama tampilan (untuk akun baru)">
      <input type="email" id="email-input" placeholder="Email">
      <input type="password" id="password-input" placeholder="Password minimal 6 karakter">
      <input type="file" id="profile-photo-input" accept="image/*" style="color:#bbb">
      <button class="modal-btn" type="button" onclick="buatAkunEmail()">Buat Akun</button>
      <button class="modal-btn" type="button" style="background:#333" onclick="masukAkun()">Masuk</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Batal</button>
    </div>
  </div>

  <!-- POPUP TAMBAH SHORTS -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambahkan Short Baru</h3>
      <input type="text" id="video-id-input" placeholder="Link YouTube Shorts (youtube.com/shorts/...)">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (misal: @Kreator)">
      <button type="button" class="modal-btn" id="btn-tambah-video" onclick="simpanShortManual(); return false;">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIKA LENGKAP -->
  <script>
    var currentUser = localStorage.getItem('sv_user') || 'Tamu';
    var videoList = JSON.parse(localStorage.getItem('sv_videos')) || [];
    var allVideoList = videoList.slice();
    var showMyVideos = false;
    var activeVideoIndex = 0;

    // Cek status akun
    if (localStorage.getItem('sv_user')) {
      tampilkanUserBadge(currentUser);
    }

    // Navigasi Layar (Main vs Shorts)
    function bukaHalaman(halaman) {
      tutupKomentar();
      if (halaman === 'main') {
        document.getElementById('page-main').style.display = 'flex';
        document.getElementById('page-shorts').style.display = 'none';
        document.getElementById('side-main').classList.add('active');
        document.getElementById('side-shorts').classList.remove('active');
      } else {
        if (videoList.length === 0) {
          alert('Belum ada video! Silakan tambahkan video terlebih dahulu.');
          bukaModal('add-modal');
          return;
        }
        document.getElementById('page-main').style.display = 'none';
        document.getElementById('page-shorts').style.display = 'block';
        document.getElementById('side-main').classList.remove('active');
        document.getElementById('side-shorts').classList.add('active');
      }
    }

    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    // Render Ulang Feed Video
    function renderVideos() {
      const feed = document.getElementById('page-shorts');
      feed.innerHTML = '';

      if (videoList.length === 0) {
        document.getElementById('empty-info').innerText = 'Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!';
        return;
      } else {
        document.getElementById('empty-info').innerText = `Ada ${videoList.length} video tersimpan siap ditonton!`;
      }

      videoList.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'short-container';
        card.innerHTML = `
          <div class="video-frame">
            ${v.ownerId && svAuth && svAuth.currentUser && v.ownerId === svAuth.currentUser.uid ? `<button class="delete-video" onclick="hapusVideo(${index}); event.stopPropagation();">Hapus</button>` : ''}
            <iframe 
              src="https://www.youtube.com/embed/${v.id}?autoplay=0&mute=0&playsinline=1&enablejsapi=1&rel=0&origin=${encodeURIComponent(location.origin)}" 
              allow="autoplay; accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>
            <div class="channel-overlay">
              <div class="channel-header">
                <div class="channel-pic">${v.channel.charAt(1).toUpperCase()}</div>
                <span class="channel-name">${v.channel}</span>
                <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
              </div>
              <div style="font-size:13px;">Shorts pilihan di ShortVideo 🔥</div>
            </div>
          </div>
          <div class="actions-bar">
            <!-- Like Dimulai dari 0 -->
            <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${index}, this)">
              <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            </button>
            <span class="action-label" id="like-text-${index}">${v.likes}</span>

            <button class="action-btn" onclick="toggleDislike(${index}); this.classList.toggle('active')">
              <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
            </button>

            <!-- Buka Komentar -->
            <button class="action-btn" onclick="bukaKomentar(${index})">
              <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            </button>
            <span class="action-label">${v.comments.length}</span>

            <!-- Bagikan -->
            <button class="action-btn" onclick="bagikanLink()">
              <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
            </button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    // Fitur Tambah Video
    function tambahVideo() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || '@Kreator';
      if (!input) return alert('Silakan masukkan link Shorts!');

      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];

      videoList.push({
        id: id,
        channel: channel,
        likes: 0,
        liked: false,
        comments: []
      });

      localStorage.setItem('sv_videos', JSON.stringify(videoList));
      document.getElementById('video-id-input').value = '';
      tutupModal('add-modal');
      renderVideos();
      bukaHalaman('shorts');
    }

    // Like dari 0 (Toggle 0 ke 1)
    function toggleLike(index, btn) {
      if (videoList[index].liked) {
        videoList[index].likes = 0;
        videoList[index].liked = false;
        btn.classList.remove('active');
      } else {
        videoList[index].likes = 1;
        videoList[index].liked = true;
        btn.classList.add('active');
      }
      document.getElementById(`like-text-${index}`).innerText = videoList[index].likes;
      localStorage.setItem('sv_videos', JSON.stringify(videoList));
    }

    function toggleSub(btn) {
      btn.classList.toggle('subscribed');
      btn.innerText = btn.classList.contains('subscribed') ? 'Disubscribe ✓' : 'Subscribe';
    }

    // Komentar per Video
    function bukaKomentar(index) {
      activeVideoIndex = index;
      const drawer = document.getElementById('comment-drawer');
      const list = document.getElementById('comment-list');
      list.innerHTML = '';

      const v = videoList[index];
      if (v.comments.length === 0) {
        list.innerHTML = '<div style="color:#777; font-size:13px; text-align:center; padding:20px;">Belum ada komentar. Jadilah yang pertama!</div>';
      } else {
        v.comments.forEach(c => {
          const item = document.createElement('div');
          item.className = 'comment-item';
          item.innerHTML = `<strong>@${c.user}:</strong> ${c.text}`;
          list.appendChild(item);
        });
      }

      drawer.style.display = 'flex';
    }

    function tutupKomentar() { document.getElementById('comment-drawer').style.display = 'none'; }

    function kirimKomentar() {
      const input = document.getElementById('input-komentar');
      const text = input.value.trim();
      if (!text) return;

      videoList[activeVideoIndex].comments.push({
        user: currentUser,
        text: text
      });

      localStorage.setItem('sv_videos', JSON.stringify(videoList));
      input.value = '';
      bukaKomentar(activeVideoIndex);
      renderVideos();
    }

    function bagikanLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Tautan ShortVideo disalin ke clipboard! 📋');
    }

    function buatAkun() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Masukkan nama kamu!');
      currentUser = name;
      localStorage.setItem('sv_user', name);
      tampilkanUserBadge(name);
      tutupModal('auth-modal');
      alert('Akun @' + name + ' berhasil dibuat!');
    }

    function tampilkanUserBadge(name) {
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      badge.innerText = name.charAt(0).toUpperCase();
    }

    // Muat data awal
    renderVideos();
  </script>


  <!-- =========================================================
       FIREBASE CONFIG — TEMPEL KONFIGURASI FIREBASE DI SINI
       Cari tulisan FIREBASE_CONFIG untuk mengubahnya.
       ========================================================= -->
  <!-- Firebase: isi konfigurasi publik Firebase milikmu di bawah ini -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey: "ISI_API_KEY_FIREBASE",
      authDomain: "ISI_PROJECT_ID.firebaseapp.com",
      projectId: "ISI_PROJECT_ID",
      storageBucket: "ISI_PROJECT_ID.firebasestorage.app",
      messagingSenderId: "ISI_MESSAGING_SENDER_ID",
      appId: "ISI_APP_ID"
    };

    let svDb = null, svAuth = null, svStorage = null, svFirebaseReady = false;
    const firebaseConfigured = !Object.values(FIREBASE_CONFIG).some(v => String(v).startsWith('ISI_'));

    function svToast(message) { alert(message); }
    function svEscape(value) { return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    async function startFirebase() {
      if (!firebaseConfigured) {
        console.warn('Firebase belum dikonfigurasi. Aplikasi berjalan dalam mode lokal.');
        return;
      }
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        svDb = firebase.firestore(); svAuth = firebase.auth(); svStorage = firebase.storage();
        svFirebaseReady = true;
        if (!svAuth.currentUser) await svAuth.signInAnonymously();
        svAuth.onAuthStateChanged(async user => {
          if (!user) return;
          const snap = await svDb.collection('users').doc(user.uid).get();
          if (snap.exists) {
            const profile = snap.data(); currentUser = profile.name || 'Tamu';
            tampilkanUserBadge(currentUser);
            if (profile.photoURL) document.getElementById('user-badge').style.backgroundImage = `url(${profile.photoURL})`;
          }
        });
        svDb.collection('videos').orderBy('createdAt', 'desc').onSnapshot(async snapshot => {
          // Jika Firestore masih kosong, pindahkan video lokal ke Firebase satu kali.
          const localSaved = JSON.parse(localStorage.getItem('sv_videos') || '[]');
          if (snapshot.empty && localSaved.length && svAuth.currentUser) {
            const batch = svDb.batch();
            localSaved.forEach(v => {
              const ref = svDb.collection('videos').doc();
              batch.set(ref, {
                id: v.id, channel: v.channel || '@Kreator', likes: v.likes || 0,
                dislikes: v.dislikes || 0, ownerId: svAuth.currentUser.uid, ownerName: currentUser, ownerPhoto: '', tags: [String(v.channel || '@Kreator').toLowerCase()],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
              });
            });
            await batch.commit();
            return;
          }
          allVideoList = snapshot.docs.map(d => ({ firebaseId:d.id, ...d.data(), comments:[] }));
          videoList = showMyVideos ? allVideoList.filter(v => v.ownerId === svAuth.currentUser.uid) : allVideoList.slice();
          localStorage.setItem('sv_videos', JSON.stringify(allVideoList));
          await rankPersonalizedVideos();
          renderVideos();
          document.getElementById('empty-info').innerText = videoList.length
            ? `Ada ${videoList.length} video tersimpan siap ditonton!`
            : 'Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!';
        });
      } catch (error) { console.error(error); svToast('Firebase belum siap. Cek konfigurasi dan Authentication Anonymous.'); }
    }

    // Rekomendasi awal: video dengan topik yang sering ditonton pengguna dinaikkan.
    async function rankPersonalizedVideos() {
      if (!svFirebaseReady || !svAuth.currentUser || videoList.length < 2) return;
      const history = await svDb.collection('watchEvents').where('uid','==',svAuth.currentUser.uid).limit(50).get();
      const watchedIds = new Set(history.docs.map(d => d.data().videoId));
      const watched = videoList.filter(v => watchedIds.has(v.firebaseId || v.id));
      const interests = new Set(watched.flatMap(v => v.tags || [v.channel]));
      videoList.sort((a,b) => {
        const score = v => (v.tags || [v.channel]).reduce((n,t) => n + (interests.has(t) ? 3 : 0), 0) + (watchedIds.has(v.firebaseId || v.id) ? -2 : 0);
        return score(b) - score(a);
      });
    }

    // Satu video aktif saja: video yang keluar viewport langsung dijeda.
    function svYouTubeCommand(iframe, func, args=[]) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args}), '*');
    }

    function setupShortsPlayback() {
      const cards = [...document.querySelectorAll('.short-container')];
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const iframe = entry.target.querySelector('iframe');
          if (!iframe) return;
          if (entry.isIntersecting) {
            svYouTubeCommand(iframe, 'unMute');
            svYouTubeCommand(iframe, 'playVideo');
          } else {
            svYouTubeCommand(iframe, 'pauseVideo');
          }
          entry.target.classList.toggle('is-active', entry.isIntersecting);
          if (entry.isIntersecting) {
            const v = videoList[Number(entry.target.dataset.index)];
            if (v && svFirebaseReady && svAuth.currentUser) {
              svDb.collection('watchEvents').add({uid:svAuth.currentUser.uid, videoId:v.firebaseId || v.id, watchedAt:firebase.firestore.FieldValue.serverTimestamp()});
            }
          }
        });
      }, { threshold: 0.65 });
      cards.forEach((card, i) => {
        card.dataset.index=i;
        const iframe = card.querySelector('iframe');
        if (iframe) {
          iframe.addEventListener('load', () => {
            setTimeout(() => svYouTubeCommand(iframe, 'pauseVideo'), 700);
          });
        }
        observer.observe(card);
      });
      setTimeout(() => {
        const active = cards.find(card => card.classList.contains('is-active')) || cards[0];
        if (active) svYouTubeCommand(active.querySelector('iframe'), 'playVideo');
      }, 1200);
    }

    const oldRenderVideos = renderVideos;
    renderVideos = function() { oldRenderVideos(); setupShortsPlayback(); };

    const oldTambahVideo = tambahVideo;
    tambahVideo = async function() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || '@Kreator';
      if (!input) return svToast('Silakan masukkan link Shorts!');
      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];
      if (svFirebaseReady) {
        await svDb.collection('videos').add({id, channel, ownerId:svAuth.currentUser.uid, ownerName:currentUser, ownerPhoto:'', likes:0, dislikes:0, createdAt:firebase.firestore.FieldValue.serverTimestamp(), tags:channel.toLowerCase().split(/\s+/)});
        document.getElementById('video-id-input').value=''; document.getElementById('video-channel-input').value=''; tutupModal('add-modal'); bukaHalaman('shorts');
      } else oldTambahVideo();
    };

    const oldToggleLike = toggleLike;
    toggleLike = async function(index, btn) {
      const v=videoList[index];
      if (!svFirebaseReady || !v.firebaseId) return oldToggleLike(index, btn);
      if (!svAuth.currentUser) return;
      const ref=svDb.collection('videos').doc(v.firebaseId).collection('reactions').doc(svAuth.currentUser.uid);
      const snap=await ref.get(); const next=snap.exists && snap.data().type==='like' ? null : 'like';
      await ref.set({type:next, uid:svAuth.currentUser.uid},{merge:true});
      await svDb.collection('videos').doc(v.firebaseId).update({likes:firebase.firestore.FieldValue.increment(next ? 1 : -1)});
    };

    async function toggleDislike(index) {
      const v=videoList[index]; if (!svFirebaseReady || !v.firebaseId || !svAuth.currentUser) return;
      const ref=svDb.collection('videos').doc(v.firebaseId).collection('reactions').doc(svAuth.currentUser.uid);
      const snap=await ref.get(); const next=snap.exists && snap.data().type==='dislike' ? null : 'dislike';
      await ref.set({type:next,uid:svAuth.currentUser.uid},{merge:true});
      await svDb.collection('videos').doc(v.firebaseId).update({dislikes:firebase.firestore.FieldValue.increment(next ? 1 : -1)});
    }

    const oldKirimKomentar = kirimKomentar;
    kirimKomentar = async function() {
      const input=document.getElementById('input-komentar'), text=input.value.trim(), v=videoList[activeVideoIndex];
      if (!text) return;
      if (svFirebaseReady && v.firebaseId && svAuth.currentUser) {
        await svDb.collection('videos').doc(v.firebaseId).collection('comments').add({user:currentUser,text,uid:svAuth.currentUser.uid,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        input.value=''; await bukaKomentar(activeVideoIndex); return;
      }
      oldKirimKomentar();
    };

    const oldBukaKomentar = bukaKomentar;
    bukaKomentar = async function(index) {
      activeVideoIndex=index; const v=videoList[index];
      if (!svFirebaseReady || !v.firebaseId) return oldBukaKomentar(index);
      const list=document.getElementById('comment-list'); list.innerHTML='Memuat komentar...'; document.getElementById('comment-drawer').style.display='flex';
      const snap=await svDb.collection('videos').doc(v.firebaseId).collection('comments').orderBy('createdAt','asc').get();
      list.innerHTML=snap.empty ? '<div style="color:#777;text-align:center;padding:20px">Belum ada komentar. Jadilah yang pertama!</div>' : '';
      snap.forEach(d=>{const c=d.data(), item=document.createElement('div'); item.className='comment-item'; item.innerHTML=`<strong>@${svEscape(c.user)}:</strong> ${svEscape(c.text)}`; list.appendChild(item);});
    };

    const oldBuatAkun = buatAkun;
    buatAkun = async function() {
      const name=document.getElementById('username-input').value.trim(); if (!name) return svToast('Masukkan nama kamu!');
      if (!svFirebaseReady || !svAuth.currentUser) return oldBuatAkun();
      const file=document.getElementById('profile-photo-input').files[0]; let photoURL='';
      if (file) { const task=await svStorage.ref(`profiles/${svAuth.currentUser.uid}`).put(file); photoURL=await task.ref.getDownloadURL(); }
      await svDb.collection('users').doc(svAuth.currentUser.uid).set({name,photoURL,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
      const owned = await svDb.collection('videos').where('ownerId','==',svAuth.currentUser.uid).get();
      const profileBatch = svDb.batch();
      owned.forEach(doc => profileBatch.update(doc.ref, {ownerName:name, ownerPhoto:photoURL}));
      if (!owned.empty) await profileBatch.commit();
      currentUser=name; localStorage.setItem('sv_user',name); tampilkanUserBadge(name); if(photoURL) document.getElementById('user-badge').style.backgroundImage=`url(${photoURL})`; tutupModal('auth-modal');
    };

    async function buatAkunEmail() {
      if (!svFirebaseReady) return alert('Firebase belum siap.');
      const name = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!name || !email || password.length < 6) return alert('Isi nama, email, dan password minimal 6 karakter.');
      try {
        const result = await svAuth.createUserWithEmailAndPassword(email, password);
        let photoURL = '';
        const file = document.getElementById('profile-photo-input').files[0];
        if (file) { const task = await svStorage.ref(`profiles/${result.user.uid}`).put(file); photoURL = await task.ref.getDownloadURL(); }
        await svDb.collection('users').doc(result.user.uid).set({name, email, photoURL, updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
        currentUser=name; localStorage.setItem('sv_user', name); tampilkanUserBadge(name);
        if (photoURL) document.getElementById('user-badge').style.backgroundImage=`url(${photoURL})`;
        tutupModal('auth-modal'); alert('Akun berhasil dibuat.');
      } catch (error) { alert(error.message); }
    }

    async function masukAkun() {
      if (!svFirebaseReady) return alert('Firebase belum siap.');
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) return alert('Masukkan email dan password.');
      try {
        const result = await svAuth.signInWithEmailAndPassword(email, password);
        const snap = await svDb.collection('users').doc(result.user.uid).get();
        const profile = snap.exists ? snap.data() : {};
        currentUser = profile.name || email.split('@')[0]; localStorage.setItem('sv_user', currentUser); tampilkanUserBadge(currentUser);
        if (profile.photoURL) document.getElementById('user-badge').style.backgroundImage=`url(${profile.photoURL})`;
        tutupModal('auth-modal'); location.reload();
      } catch (error) { alert('Email atau password salah, atau akun belum dibuat.'); }
    }

    async function hapusVideo(index) {
      const v = videoList[index];
      if (!v || !v.firebaseId || !svFirebaseReady || !svAuth.currentUser || v.ownerId !== svAuth.currentUser.uid) return;
      if (!confirm('Hapus video ini?')) return;
      await svDb.collection('videos').doc(v.firebaseId).delete();
    }

    function tampilkanVideoSaya() {
      if (!svFirebaseReady || !svAuth.currentUser) { alert('Tunggu akun Firebase selesai dimuat.'); return; }
      showMyVideos = true;
      videoList = allVideoList.filter(v => v.ownerId === svAuth.currentUser.uid);
      renderVideos();
      document.getElementById('page-main').style.display = 'none';
      document.getElementById('page-shorts').style.display = 'block';
      document.getElementById('side-main').classList.remove('active');
      document.getElementById('side-shorts').classList.remove('active');
      document.getElementById('side-my-videos').classList.add('active');
    }

    // Klik Shorts kembali ke feed umum.
    const oldBukaHalaman = bukaHalaman;
    bukaHalaman = function(halaman) {
      if (halaman === 'shorts') {
        showMyVideos = false;
        videoList = allVideoList.slice();
        document.getElementById('side-my-videos')?.classList.remove('active');
      }
      return oldBukaHalaman(halaman);
    };

    startFirebase();
  </script>

  <!-- Jalur cadangan agar tombol Tambahkan tetap bekerja walau Firebase belum siap -->
  <script>
    window.simpanShortManual = function () {
      const input = document.getElementById('video-id-input');
      const channelInput = document.getElementById('video-channel-input');
      const link = (input && input.value || '').trim();
      const channel = (channelInput && channelInput.value || '').trim() || '@Kreator';
      if (!link) { alert('Silakan masukkan link Shorts terlebih dahulu.'); return false; }

      let id = link;
      if (link.includes('shorts/')) id = link.split('shorts/')[1].split(/[?&]/)[0];
      else if (link.includes('watch?v=')) id = link.split('watch?v=')[1].split('&')[0];
      else if (link.includes('youtu.be/')) id = link.split('youtu.be/')[1].split(/[?&]/)[0];
      id = id.trim();
      if (!id) { alert('Link YouTube Shorts tidak valid.'); return false; }

      const saved = JSON.parse(localStorage.getItem('sv_videos') || '[]');
      saved.push({ id, channel, likes: 0, liked: false, dislikes: 0, comments: [] });
      localStorage.setItem('sv_videos', JSON.stringify(saved));
      if (input) input.value = '';
      if (channelInput) channelInput.value = '';
      const modal = document.getElementById('add-modal');
      if (modal) modal.style.display = 'none';
      window.location.reload();
      return false;
    };
  </script>
