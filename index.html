<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ShortVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 1. NAVBAR SHORTVIDEO */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    .brand-logo {
      display: flex; align-items: center; gap: 6px;
      font-weight: bold; font-size: 19px; color: #fff;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 3px 8px; border-radius: 6px; font-size: 12px;
    }

    .header-center { display: flex; align-items: center; width: 40%; max-width: 480px; }
    .search-box {
      width: 100%; padding: 8px 16px; border-radius: 20px 0 0 20px;
      border: 1px solid #303030; background: #121212; color: white; outline: none;
    }
    .search-btn {
      padding: 8px 18px; border-radius: 0 20px 20px 0;
      border: 1px solid #303030; border-left: none; background: #222; color: white; cursor: pointer;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 8px 14px; border-radius: 18px; font-size: 14px; cursor: pointer;
    }
    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .avatar-badge {
      display: none; width: 34px; height: 34px; border-radius: 50%;
      background-color: #00bcd4; color: #000; align-items: center; justify-content: center; font-weight: bold;
    }

    /* 2. LAYOUT UTAMA */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* Sidebar Kiri (Shorts Dihapus, Diganti ShortVideo) */
    .sidebar {
      width: 80px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 15px;
      gap: 25px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 10px; color: #aaa; cursor: pointer;
    }
    .side-item.active { color: #fff; font-weight: bold; }
    .side-item span { font-size: 22px; }

    /* Feed Shorts: DIKUNCI VERTIKAL KE BAWAH (BUKAN KE SAMPING) */
    .shorts-feed-wrapper {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      display: block; /* Memaksa video bertumpuk ke bawah */
    }
    .shorts-feed-wrapper::-webkit-scrollbar { display: none; }

    /* Wadah 1 Layar Penuh per Video */
    .short-container {
      width: 100%;
      height: calc(100vh - 56px); /* Pas 1 tinggi layar PC */
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Bingkai Video 9:16 Pas di Tengah */
    .video-frame {
      height: 88vh;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
    }

    iframe { width: 100%; height: 100%; border: none; }

    /* Info Channel & Subscribe */
    .channel-overlay {
      position: absolute;
      bottom: 20px;
      left: 15px;
      right: 15px;
      color: white;
      z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 36px; height: 36px; border-radius: 50%; background: #e91e63;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Tombol Interaksi Kanan */
    .actions-bar {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-circle {
      width: 48px; height: 48px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white; cursor: pointer; font-size: 20px;
    }
    .action-circle:hover { background: #3f3f3f; }
    .action-label { font-size: 11px; margin-top: 2px; }

    /* Modal Popup */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-box input {
      padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="header-left">
      <div class="brand-logo"><span class="brand-icon">▶</span> ShortVideo</div>
    </div>
    <div class="header-center">
      <input type="text" class="search-box" placeholder="Telusuri ShortVideo...">
      <button class="search-btn">🔍</button>
    </div>
    <div class="header-right">
      <button class="btn-create" onclick="bukaModal('add-modal')">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModal('auth-modal')">Buat Akun</button>
      <div class="avatar-badge" id="user-badge">U</div>
    </div>
  </header>

  <!-- LAYOUT UTAMA -->
  <div class="main-layout">
    
    <!-- Sidebar Kiri -->
    <div class="sidebar">
      <div class="side-item active"><span>🏠</span>ShortVideo</div>
      <div class="side-item"><span>📺</span>Langganan</div>
      <div class="side-item"><span>📁</span>Koleksi</div>
    </div>

    <!-- Feed Shorts Vertikal Ke Bawah -->
    <div class="shorts-feed-wrapper" id="feed-wrapper">
      
      <!-- Video 1 (Satu Layar Penuh) -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/jNQXAC9IVRw?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic">J</div>
              <span class="channel-name">@jawed</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Me at the zoo 🐘 #ShortVideo</div>
          </div>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">3.2 jt</span>
          <div class="action-circle">💬</div>
          <span class="action-label">15 rb</span>
          <div class="action-circle">↗️</div>
        </div>
      </div>

      <!-- Video 2 (Ada di Bawahnya, Baru Kelihatan Pas di-Scroll) -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic" style="background:#4caf50;">R</div>
              <span class="channel-name">@RickMusic</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Never Gonna Give You Up! 🕺🎶</div>
          </div>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">18 jt</span>
          <div class="action-circle">💬</div>
          <span class="action-label">420 rb</span>
          <div class="action-circle">↗️</div>
        </div>
      </div>

    </div>
  </div>

  <!-- POPUP BUAT AKUN -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3>Buat Akun ShortVideo</h3>
      <input type="text" id="username-input" placeholder="Masukkan Nama Kamu">
      <button class="modal-btn" onclick="buatAkun()">Simpan Akun</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Batal</button>
    </div>
  </div>

  <!-- POPUP TAMBAH VIDEO -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambah ShortVideo</h3>
      <input type="text" id="video-id-input" placeholder="Link YouTube Shorts">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (@NamaKamu)">
      <button class="modal-btn" onclick="tambahVideo()">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <script>
    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    function toggleSub(btn) {
      if (btn.classList.contains('subscribed')) {
        btn.classList.remove('subscribed');
        btn.innerText = 'Subscribe';
      } else {
        btn.classList.add('subscribed');
        btn.innerText = 'Disubscribe ✓';
      }
    }

    function buatAkun() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Masukkan nama kamu!');
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      badge.innerText = name.charAt(0).toUpperCase();
      tutupModal('auth-modal');
      alert('Selamat datang di ShortVideo, ' + name + '!');
    }

    function tambahVideo() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || '@Creator';
      if (!input) return alert('Masukkan link video!');

      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];

      const wrapper = document.getElementById('feed-wrapper');
      const newCard = document.createElement('div');
      newCard.className = 'short-container';
      newCard.innerHTML = `
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic" style="background:#ff9800;">${channel.charAt(1).toUpperCase()}</div>
              <span class="channel-name">${channel}</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Video baru di ShortVideo! 🔥</div>
          </div>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">1</span>
          <div class="action-circle">💬</div>
          <span class="action-label">0</span>
          <div class="action-circle">↗️</div>
        </div>
      `;
      wrapper.appendChild(newCard);
      document.getElementById('video-id-input').value = '';
      tutupModal('add-modal');
      newCard.scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
