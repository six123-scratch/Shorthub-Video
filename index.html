<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShortHub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 1. NAVBAR */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 19px; color: #fff; cursor: pointer; flex-shrink: 0;
      letter-spacing: -0.5px;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 4px 8px; border-radius: 8px; display: flex; align-items: center;
    }
    .hub-badge {
      background: #ff0000;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 14px;
      margin-left: -4px;
    }

    /* SEARCH BAR */
    .search-box-container {
      display: flex;
      align-items: center;
      flex: 1;
      max-width: 440px;
      background: #121212;
      border: 1px solid #303030;
      border-radius: 24px;
      padding: 2px 6px 2px 14px;
      transition: 0.2s;
    }
    .search-box-container:focus-within {
      border-color: #ff0000;
      box-shadow: 0 0 8px rgba(255,0,0,0.3);
    }
    .search-box-container input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 13px;
    }
    .btn-search-submit {
      background: #272727;
      border: none;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-search-submit:hover { background: #ff0000; }

    .header-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 7px 14px; border-radius: 18px; font-size: 13px; cursor: pointer; font-weight: 500;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 7px 14px; border-radius: 18px; font-size: 13px; cursor: pointer; font-weight: bold;
    }
    .btn-logout { display:none; background:#272727; color:#fff; border:0; padding:7px 12px; border-radius:18px; cursor:pointer; font-size: 12px; }
    .avatar-badge {
      display: none; width: 34px; height: 34px; border-radius: 50%; cursor: pointer;
      background-color: #ff0000; color: #fff; align-items: center; justify-content: center; font-weight: bold;
      background-size: cover; background-position: center; border: 2px solid #fff;
    }

    /* 2. CHIPS TOPIK TREN */
    .chips-bar {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: #0f0f0f;
      border-bottom: 1px solid #1f1f1f;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
    }
    .chips-bar::-webkit-scrollbar { display: none; }
    .chip {
      background: #272727;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 16px;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .chip:hover, .chip.active {
      background: #ff0000;
      border-color: #ff0000;
      font-weight: bold;
    }

    /* 3. LAYOUT */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 102px);
      overflow: hidden;
      position: relative;
    }

    .sidebar {
      width: 72px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 14px;
      gap: 18px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
      z-index: 10;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 5px; font-size: 11px; color: #aaa; cursor: pointer; width: 100%; padding: 6px 0;
    }
    .side-item:hover, .side-item.active { color: #fff; font-weight: bold; }
    .side-item.active svg { fill: #ff0000; }
    .side-icon-svg { width: 22px; height: 22px; fill: #ffffff; }

    /* HALAMAN MAIN */
    #page-main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .main-title { font-size: 32px; font-weight: bold; margin-bottom: 25px; color: #ffffff; }
    .main-buttons-group { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
    .btn-main-action {
      padding: 12px 24px; font-size: 15px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-main-play { background-color: #ff0000; color: white; }
    .btn-main-play:hover { background-color: #cc0000; transform: scale(1.04); }
    .btn-main-add { background-color: #272727; color: white; }
    .btn-main-add:hover { background-color: #3f3f3f; transform: scale(1.04); }

    /* HALAMAN SHORTS */
    #page-shorts {
      display: none;
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #page-shorts::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      height: calc(100vh - 102px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 10px 0;
    }

    /* UKURAN VIDEO PROPORSIONAL (TIDAK TERLALU TINGGI) */
    .video-frame {
      height: 78vh;
      max-height: 610px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 22px rgba(0,0,0,0.85);
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Channel Overlay */
    .channel-overlay {
      position: absolute;
      bottom: 18px; left: 14px; right: 75px;
      color: white; z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 36px; height: 36px; border-radius: 50%; background-color: #ff5722;
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      border: 1.5px solid #fff; flex-shrink: 0;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 5px 12px; border-radius: 18px; font-size: 12px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Actions Bar */
    .actions-bar {
      margin-left: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      z-index: 20;
    }
    .action-btn {
      width: 44px; height: 44px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .action-btn:hover { background: #3f3f3f; }
    .action-btn.active svg { fill: #ff0000; }
    .action-btn svg { width: 20px; height: 20px; fill: #ffffff; }
    .action-label { font-size: 11px; margin-top: 2px; }

    /* Responsif HP */
    @media (max-width: 768px) {
      .sidebar { width: 56px; gap: 12px; }
      .search-box-container { max-width: 160px; }
      .video-frame { height: 82vh; max-height: 570px; }
      .actions-bar {
        position: absolute;
        right: 12px;
        bottom: 25px;
        margin-left: 0;
        gap: 10px;
      }
      .action-btn { width: 40px; height: 40px; background: rgba(30,30,30,0.85); }
    }

    /* Drawer Komentar */
    .comment-drawer {
      display: none; position: fixed; right: 0; bottom: 0;
      width: 350px; height: calc(100vh - 56px); background: #181818;
      border-left: 1px solid #303030; z-index: 90;
      flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    @media (max-width: 500px) { .comment-drawer { width: 100%; } }
    .comment-header {
      padding: 14px; border-bottom: 1px solid #303030;
      display: flex; justify-content: space-between; align-items: center; font-weight: bold;
    }
    .comment-list {
      flex: 1; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .comment-item { font-size: 13px; background: #222; padding: 10px; border-radius: 8px; display:flex; gap:10px; }
    .comment-avatar { 
      width:30px; height:30px; border-radius:50%; background:#ff5722 center/cover no-repeat; 
      display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:bold; font-size: 11px;
    }
    .comment-content { display: flex; flex-direction: column; gap: 3px; width: 100%; }
    .comment-gif { max-width: 160px; border-radius: 8px; margin-top: 4px; display: block; }
    
    .gif-picker {
      display: none; background: #222; padding: 8px; border-top: 1px solid #333;
      gap: 8px; overflow-x: auto; white-space: nowrap;
    }
    .gif-picker img { width: 70px; height: 50px; object-fit: cover; border-radius: 6px; cursor: pointer; }

    .comment-input-area {
      padding: 10px; border-top: 1px solid #303030; display: flex; gap: 6px; align-items: center;
    }
    .comment-input-area input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #444;
      background: #121212; color: white; outline: none; font-size: 13px;
    }
    .comment-input-area button {
      background: #ff0000; color: white; border: none; padding: 7px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 12px;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 22px; border-radius: 14px; width: 90%; max-width: 360px;
      display: flex; flex-direction: column; gap: 14px;
    }
    .modal-box input {
      padding: 10px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 11px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .profile-preview {
      width: 65px; height: 65px; border-radius: 50%; margin: 0 auto; background: #333 center/cover no-repeat; border: 2px solid #555;
    }
  </style>
</head>
<body>

  <!-- 1. NAVBAR -->
  <header>
    <div class="brand-logo" onclick="bukaHalaman('main')">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </span>
      Short<span class="hub-badge">Hub</span>
    </div>

    <!-- KOLOM PENCARIAN -->
    <div class="search-box-container">
      <input type="text" id="global-search-input" placeholder="Cari Roblox, Anime, Lucu..." onkeypress="if(event.key==='Enter') cariVideoShorts()">
      <button type="button" class="btn-search-submit" onclick="cariVideoShorts()" title="Cari">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="white"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </button>
    </div>

    <div class="header-right">
      <button type="button" class="btn-create" onclick="bukaModal('add-modal')">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModalAuth()">Masuk</button>
      <div class="avatar-badge" id="user-badge" onclick="bukaModalAuth()" title="Profil Saya"></div>
      <button type="button" class="btn-logout" id="logout-btn" onclick="keluarAkun()">Keluar</button>
    </div>
  </header>

  <!-- 2. TOMBOL TOPIK CEPAT (CHIPS) -->
  <div class="chips-bar">
    <button class="chip active" onclick="pilihTopik('semua', this)">🔥 Semua</button>
    <button class="chip" onclick="pilihTopik('roblox shorts', this)">🎮 Roblox</button>
    <button class="chip" onclick="pilihTopik('minecraft shorts', this)">⛏️ Minecraft</button>
    <button class="chip" onclick="pilihTopik('anime edit shorts', this)">🎌 Anime</button>
    <button class="chip" onclick="pilihTopik('lucu ngakak shorts', this)">😂 Komedi</button>
    <button class="chip" onclick="pilihTopik('sepak bola skill shorts', this)">⚽ Sepak Bola</button>
    <button class="chip" onclick="pilihTopik('musik viral shorts', this)">🎵 Musik</button>
  </div>

  <!-- 3. LAYOUT UTAMA -->
  <div class="main-layout">
    <div class="sidebar">
      <div class="side-item active" id="side-main" onclick="bukaHalaman('main')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Main
      </div>
      <div class="side-item" id="side-shorts" onclick="bukaHalaman('shorts')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        Shorts
      </div>
      <div class="side-item" id="side-my-videos" onclick="tampilkanVideoSaya()">

        Tambahanku
      </div>
    </div>

    <!-- HALAMAN MAIN -->
    <div id="page-main">
      <div class="main-title">Mau nonton apa di ShortHub?</div>
      <div class="main-buttons-group">
        <button class="btn-main-action btn-main-play" onclick="bukaHalaman('shorts')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          Mulai Nonton
        </button>
        <button type="button" class="btn-main-action btn-main-add" onclick="bukaModal('add-modal')">
          ＋ Tambah Link Sendiri
        </button>
      </div>
      <p id="empty-info" style="color: #888; margin-top: 25px; font-size: 14px;">Ketik kata kunci di atas atau pilih kategori untuk memulai!</p>
    </div>

    <!-- HALAMAN SHORTS -->
    <div id="page-shorts"></div>
  </div>

  <!-- PANEL KOMENTAR -->
  <div class="comment-drawer" id="comment-drawer">
    <div class="comment-header">
      <span>Komentar</span>
      <button style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;" onclick="tutupKomentar()">✕</button>
    </div>
    
    <div class="comment-list" id="comment-list"></div>

    <div class="gif-picker" id="gif-picker">
      <img src="https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif" onclick="kirimGif(this.src)" alt="Clap">
      <img src="https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif" onclick="kirimGif(this.src)" alt="Wow">
      <img src="https://media.giphy.com/media/10UeedrT5MIfPG/giphy.gif" onclick="kirimGif(this.src)" alt="Laugh">
      <img src="https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif" onclick="kirimGif(this.src)" alt="Thumbs up">
      <img src="https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif" onclick="kirimGif(this.src)" alt="Fire">
    </div>

    <div class="comment-input-area">
      <input type="text" id="input-komentar" placeholder="Tulis komentar kamu...">
      <button type="button" onclick="toggleGifPicker()" style="background:#333">GIF</button>
      <button type="button" onclick="pilihEmoji()" style="background:#333">😊</button>
      <button type="button" onclick="kirimKomentar()">Kirim</button>
    </div>
  </div>

  <!-- POPUP AKUN -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3 id="auth-modal-title">Profil & Akun ShortHub</h3>
      <div class="profile-preview" id="modal-photo-preview"></div>
      
      <input type="text" id="username-input" placeholder="Nama tampilan">
      <div id="auth-fields">
        <input type="email" id="email-input" placeholder="Email">
        <input type="password" id="password-input" placeholder="Password minimal 6 karakter">
      </div>
      
      <label style="font-size:12px; color:#aaa; margin-top:-4px;">Ganti Foto Profil:</label>
      <input type="file" id="profile-photo-input" accept="image/*" onchange="previewUploadFoto(this)" style="color:#bbb; padding: 4px;">

      <button class="modal-btn" type="button" id="btn-save-profile" onclick="simpanProfil()">Simpan Profil</button>
      <div id="auth-buttons-group" style="display: flex; gap: 8px;">
        <button class="modal-btn" type="button" style="flex:1; background:#333;" onclick="buatAkunEmail()">Daftar</button>
        <button class="modal-btn" type="button" style="flex:1; background:#444;" onclick="masukAkun()">Masuk</button>
      </div>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Tutup</button>
    </div>
  </div>

  <!-- POPUP TAMBAH SHORTS -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambahkan Short Baru</h3>
      <input type="text" id="video-id-input" placeholder="Tempel link Shorts (youtube.com/shorts/...)">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (misal: @Kreator)">
      <input type="text" id="video-type-input" placeholder="Tipe video, misalnya gaming, komedi">
      <button type="button" class="modal-btn" onclick="simpanShortManual()">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script>
    var currentUser = localStorage.getItem('sv_user') || 'Tamu';
    var currentPhotoURL = localStorage.getItem('sv_photo') || '';
    
    let localSaved = [];
    try { localSaved = JSON.parse(localStorage.getItem('sv_videos')); } catch (e) {}
    var videoList = Array.isArray(localSaved) ? localSaved : [];
    var allVideoList = videoList.slice();
    var showMyVideos = false;
    var activeVideoIndex = 0;
    var autoSoundActive = false;

    var currentQuery = 'shorts viral trending';
    var nextSearchToken = '';
    var isLoadingMore = false;

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCaXYmvDEmHFSaUd10R4acs2cHT4Ma0mwg",
      authDomain: "shortvideo-8788a.firebaseapp.com",
      projectId: "shortvideo-8788a",
      storageBucket: "shortvideo-8788a.firebasestorage.app",
      messagingSenderId: "101344146346",
      appId: "1:101344146346:web:1a46973c68993b13e4f1d3",
      measurementId: "G-E1PYNV736D"
    };

    let svDb = null, svAuth = null, svStorage = null, svFirebaseReady = false;
    const YOUTUBE_API_KEY = "AIzaSyBVMVABSaiwt4nZCt1Fvl-dLp7b-TmzoA4";

    function svEscape(value) { 
      return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
    }

    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    function aktifkanSuaraGlobal() {
      autoSoundActive = true;
      document.querySelectorAll('.short-container iframe').forEach(frame => svYouTubeCommand(frame, 'unMute'));
      document.querySelectorAll('.btn-audio').forEach(btn => btn.style.color = '#ff0000');
    }
    window.addEventListener('click', () => { if (!autoSoundActive) aktifkanSuaraGlobal(); }, { once: true });

    function tampilkanUserBadge(name, photoURL) {
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      const photo = photoURL || currentPhotoURL;
      if (photo) {
        badge.style.backgroundImage = `url("${photo}")`;
        badge.innerText = '';
      } else {
        badge.style.backgroundImage = 'none';
        badge.innerText = (name || 'U').charAt(0).toUpperCase();
      }
      const logout = document.getElementById('logout-btn');
      if (logout) logout.style.display = 'inline-block';
    }

    if (localStorage.getItem('sv_user')) {
      tampilkanUserBadge(currentUser, currentPhotoURL);
    }

    function bukaHalaman(halaman) {
      tutupKomentar();
      if (halaman === 'main') {
        document.getElementById('page-main').style.display = 'flex';
        document.getElementById('page-shorts').style.display = 'none';
        document.getElementById('side-main').classList.add('active');
        document.getElementById('side-shorts').classList.remove('active');
        document.getElementById('side-my-videos').classList.remove('active');
        document.querySelectorAll('iframe').forEach(frame => svYouTubeCommand(frame, 'pauseVideo'));
      } else {
        showMyVideos = false;
        document.getElementById('page-main').style.display = 'none';
        document.getElementById('page-shorts').style.display = 'block';
        document.getElementById('side-main').classList.remove('active');
        document.getElementById('side-shorts').classList.add('active');
        document.getElementById('side-my-videos').classList.remove('active');

        if (videoList.length === 0) {
          cariYouTubeApi(currentQuery, false);
        } else {
          renderVideos();
        }

        aktifkanSuaraGlobal();
        setTimeout(() => {
          const firstIframe = document.querySelector('.short-container iframe');
          if (firstIframe) {
            svYouTubeCommand(firstIframe, 'seekTo', [0, true]);
            svYouTubeCommand(firstIframe, 'unMute');
            svYouTubeCommand(firstIframe, 'playVideo');
          }
        }, 300);
      }
    }

    function svYouTubeCommand(iframe, func, args=[]) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args}), '*');
    }

    /* PENCARIAN & INFINITE SCROLL DENGAN YOUTUBE DATA API V3 */
    async function cariVideoShorts() {
      const input = document.getElementById('global-search-input');
      const query = input.value.trim();
      if (!query) return;

      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      currentQuery = query + ' shorts';
      nextSearchToken = '';
      await cariYouTubeApi(currentQuery, false);
    }

    async function pilihTopik(topik, btn) {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('global-search-input').value = '';
      nextSearchToken = '';

      if (topik === 'semua') {
        currentQuery = 'shorts viral trending';
      } else {
        currentQuery = topik;
      }
      await cariYouTubeApi(currentQuery, false);
    }

    async function cariYouTubeApi(query, isLoadMore = false) {
      if (isLoadMore && isLoadingMore) return;
      const feed = document.getElementById('page-shorts');

      if (!isLoadMore) {
        feed.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:16px;color:#aaa;">Mencari video di YouTube... 🔎</div>';
        bukaHalaman('shorts');
      } else {
        isLoadingMore = true;
      }

      try {
        const maxResults = isLoadMore ? 15 : 25;
        // videoEmbeddable=true memastikan video BISA diputar & tidak pernah "video tak tersedia"
        let url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoDuration=short&videoEmbeddable=true&maxResults=${maxResults}&q=${encodeURIComponent(query)}&key=${YOUTUBE_API_KEY}`};
        if (nextSearchToken) url += `&pageToken=${nextSearchToken}`;

        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          console.error("Google API Error:", data.error);
          feed.innerHTML = `
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;">
              <div style="font-size:36px;margin-bottom:10px;">⚠️</div>
              <h3 style="color:#ff4444;margin-bottom:8px;">Izin API Belum Aktif Sepenuhnya</h3>
              <p style="color:#bbb;font-size:13px;max-width:400px;line-height:1.5;">${svEscape(data.error.message)}</p>
              <p style="color:#888;font-size:12px;margin-top:14px;">Jika baru saja klik UPDATE di Google Cloud, tunggu 1-2 menit agar server Google selesai sinkronisasi.</p>
            </div>
          `;
          return;
        }

        if (data.items && data.items.length > 0) {
          nextSearchToken = data.nextPageToken || '';
          
          const newVideos = data.items.map(item => ({
            id: item.id.videoId,
            title: item.snippet.title,
            channel: '@' + item.snippet.channelTitle,
            type: query,
            likes: Math.floor(Math.random() * 80) + 12,
            commentCount: 0,
            comments: []
          }));

          if (isLoadMore) {
            videoList.push(...newVideos);
            tambahKartuKeFeed(newVideos);
          } else {
            videoList = newVideos;
            renderVideos();
          }
        } else if (!isLoadMore) {
          feed.innerHTML = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:20px;">
            <h3>Tidak ada video untuk "${svEscape(query)}"</h3>
          </div>`;
        }
      } catch (err) {
        console.error('Fetch error:', err);
      } finally {
        isLoadingMore = false;
      }
    }

    function tambahKartuKeFeed(daftarVideoBaru) {
      const feed = document.getElementById('page-shorts');
      const startIndex = videoList.length - daftarVideoBaru.length;

      daftarVideoBaru.forEach((v, i) => {
        const index = startIndex + i;
        const card = buatElemenKartu(v, index);
        feed.appendChild(card);
      });

      setupObserver();
    }

    function buatElemenKartu(v, index) {
      const card = document.createElement('div');
      card.className = 'short-container';
      card.dataset.index = index;

      const creatorPicInitial = svEscape((v.channel || '@Kreator').replace('@','').charAt(0).toUpperCase());

      card.innerHTML = `
        <div class="video-frame">
          <iframe 
            src="https://www.youtube.com/embed/${v.id}?enablejsapi=1&autoplay=1&mute=1&playsinline=1&controls=0&loop=1&playlist=${v.id}&rel=0" 
            allow="autoplay; accelerometer; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>

          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic">${creatorPicInitial}</div>
              <span class="channel-name">${svEscape(v.channel)}</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div style="font-size:13px;">${svEscape(v.title || 'Shorts')}</div>
          </div>
        </div>

        <div class="actions-bar">
          <button class="action-btn btn-audio" onclick="toggleMuteVideo(this)" title="Suara">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>

          <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${index}, this)">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          </button>
          <span class="action-label" id="like-text-${index}">${v.likes || 0}</span>

          <button class="action-btn" onclick="tidakTertarik(${index})" title="Tidak Tertarik (Lewati)">
            <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
          </button>

          <button class="action-btn" onclick="bukaKomentar(${index})">
            <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
          </button>
          <span class="action-label" id="comment-count-${index}">${v.commentCount || 0}</span>

          <button class="action-btn" onclick="bagikanLink()">
            <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
          </button>
        </div>
      `;
      return card;
    }

    function renderVideos() {
      const feed = document.getElementById('page-shorts');
      feed.innerHTML = '';

      if (videoList.length === 0) {
        feed.innerHTML = `
          <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:20px;">
            <div style="font-size:42px; margin-bottom:10px;">📹</div>
            <h3 style="margin-bottom:8px;">Belum Ada Video</h3>
            <p style="color:#888; font-size:14px; margin-bottom:20px;">Ketik kata kunci di search bar atas atau klik kategori topik!</p>
            <button class="btn-main-action btn-main-play" onclick="bukaModal('add-modal')">＋ Tambahkan Video Manual</button>
          </div>
        `;
        return;
      }

      document.getElementById('empty-info').innerText = `Ada ${videoList.length} video siap ditonton!`;

      videoList.forEach((v, index) => {
        feed.appendChild(buatElemenKartu(v, index));
      });

      setupObserver();
    }

    // INFINITE SCROLL OTOMATIS
    const feedElement = document.getElementById('page-shorts');
    feedElement.addEventListener('scroll', () => {
      if (nextSearchToken && !isLoadingMore) {
        if (feedElement.scrollTop + feedElement.clientHeight >= feedElement.scrollHeight - 700) {
          cariYouTubeApi(currentQuery, true);
        }
      }
    });

    function toggleMuteVideo(btn) {
      const card = btn.closest('.short-container');
      const iframe = card ? card.querySelector('iframe') : null;
      if (!iframe) return;
      if (btn.classList.toggle('unmuted')) {
        svYouTubeCommand(iframe, 'mute');
        btn.style.color = '#fff';
      } else {
        svYouTubeCommand(iframe, 'unMute');
        btn.style.color = '#ff0000';
      }
    }

    function setupObserver() {
      const cards = document.querySelectorAll('.short-container');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const iframe = entry.target.querySelector('iframe');
          if (!iframe) return;
          if (entry.isIntersecting) {
            svYouTubeCommand(iframe, 'seekTo', [0, true]);
            svYouTubeCommand(iframe, 'playVideo');
            if (autoSoundActive) svYouTubeCommand(iframe, 'unMute');
          } else {
            svYouTubeCommand(iframe, 'pauseVideo');
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));
    }

    function tidakTertarik(index) {
      const nextCard = document.querySelectorAll('.short-container')[index + 1];
      if (nextCard) nextCard.scrollIntoView({ behavior: 'smooth' });
    }

    function bukaModalAuth() {
      bukaModal('auth-modal');
      document.getElementById('username-input').value = (currentUser !== 'Tamu') ? currentUser : '';
      const preview = document.getElementById('modal-photo-preview');
      preview.style.backgroundImage = currentPhotoURL ? `url("${currentPhotoURL}")` : 'none';

      if (svAuth && svAuth.currentUser && !svAuth.currentUser.isAnonymous) {
        document.getElementById('auth-fields').style.display = 'none';
        document.getElementById('auth-buttons-group').style.display = 'none';
        document.getElementById('btn-save-profile').style.display = 'block';
        document.getElementById('auth-modal-title').innerText = 'Edit Profil Saya';
      } else {
        document.getElementById('auth-fields').style.display = 'block';
        document.getElementById('auth-buttons-group').style.display = 'flex';
        document.getElementById('btn-save-profile').style.display = 'block';
        document.getElementById('auth-modal-title').innerText = 'Masuk / Buat Akun';
      }
    }

    function previewUploadFoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('modal-photo-preview').style.backgroundImage = `url("${e.target.result}")`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function kompresFoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 200 / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function simpanProfil() {
      const name = document.getElementById('username-input').value.trim();
      const file = document.getElementById('profile-photo-input').files[0];
      if (!name) return alert('Nama tidak boleh kosong!');

      currentUser = name;
      localStorage.setItem('sv_user', name);

      if (file) {
        currentPhotoURL = await kompresFoto(file);
        localStorage.setItem('sv_photo', currentPhotoURL);
      }

      if (svFirebaseReady && svAuth && svAuth.currentUser) {
        try {
          await svDb.collection('users').doc(svAuth.currentUser.uid).set({
            name: currentUser, photoURL: currentPhotoURL, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });
        } catch (e) {}
      }

      tampilkanUserBadge(currentUser, currentPhotoURL);
      tutupModal('auth-modal');
      renderVideos();
      alert('Profil berhasil disimpan!');
    }

    async function buatAkunEmail() {
      const name = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const file = document.getElementById('profile-photo-input').files[0];

      if (!name || !email || password.length < 6) return alert('Lengkapi nama, email, dan password minimal 6 karakter.');

      let photoURL = '';
      if (file) photoURL = await kompresFoto(file);

      if (svFirebaseReady && svAuth) {
        try {
          const res = await svAuth.createUserWithEmailAndPassword(email, password);
          await svDb.collection('users').doc(res.user.uid).set({
            name, email, photoURL, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (e) { return alert(e.message); }
      }

      currentUser = name;
      currentPhotoURL = photoURL;
      localStorage.setItem('sv_user', name);
      localStorage.setItem('sv_photo', photoURL);
      tampilkanUserBadge(name, photoURL);
      tutupModal('auth-modal');
      renderVideos();
    }

    async function masukAkun() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) return alert('Masukkan email dan password.');

      if (svFirebaseReady && svAuth) {
        try {
          const res = await svAuth.signInWithEmailAndPassword(email, password);
          const snap = await svDb.collection('users').doc(res.user.uid).get();
          const profile = snap.exists ? snap.data() : {};
          currentUser = profile.name || email.split('@')[0];
          currentPhotoURL = profile.photoURL || '';
        } catch (e) { return alert('Gagal masuk: ' + e.message); }
      } else {
        currentUser = email.split('@')[0];
      }

      localStorage.setItem('sv_user', currentUser);
      localStorage.setItem('sv_photo', currentPhotoURL);
      tampilkanUserBadge(currentUser, currentPhotoURL);
      tutupModal('auth-modal');
      renderVideos();
    }

    async function keluarAkun() {
      if (svFirebaseReady && svAuth) await svAuth.signOut();
      localStorage.removeItem('sv_user');
      localStorage.removeItem('sv_photo');
      location.reload();
    }

    function toggleGifPicker() {
      const picker = document.getElementById('gif-picker');
      picker.style.display = picker.style.display === 'flex' ? 'none' : 'flex';
    }

    function kirimGif(gifUrl) {
      toggleGifPicker();
      simpanKomentarData('', gifUrl);
    }

    function kirimKomentar() {
      const input = document.getElementById('input-komentar');
      const text = input.value.trim();
      if (!text) return;
      simpanKomentarData(text, '');
      input.value = '';
    }

    async function simpanKomentarData(text, gifUrl) {
      const v = videoList[activeVideoIndex];
      const commentObj = {
        user: currentUser,
        photoURL: currentPhotoURL,
        text: text,
        gif: gifUrl,
        createdAt: new Date().toISOString()
      };

      if (!v.comments) v.comments = [];
      v.comments.push(commentObj);
      v.commentCount = v.comments.length;

      const badge = document.getElementById(`comment-count-${activeVideoIndex}`);
      if (badge) badge.innerText = v.commentCount;

      muatDaftarKomentar(v);
    }

    async function bukaKomentar(index) {
      activeVideoIndex = index;
      const v = videoList[index];
      document.getElementById('comment-drawer').style.display = 'flex';
      document.getElementById('gif-picker').style.display = 'none';
      muatDaftarKomentar(v);
    }

    function muatDaftarKomentar(v) {
      const list = document.getElementById('comment-list');
      list.innerHTML = '';
      if (!v.comments || v.comments.length === 0) {
        list.innerHTML = '<div style="color:#777; font-size:13px; text-align:center; padding:20px;">Belum ada komentar.</div>';
        return;
      }
      v.comments.forEach(c => {
        const item = document.createElement('div');
        item.className = 'comment-item';
        item.innerHTML = `
          <div class="comment-avatar">${(c.user||'U').charAt(0).toUpperCase()}</div>
          <div class="comment-content">
            <div><strong>@${svEscape(c.user)}</strong></div>
            ${c.text ? `<div>${svEscape(c.text)}</div>` : ''}
            ${c.gif ? `<img class="comment-gif" src="${c.gif}" alt="GIF">` : ''}
          </div>
        `;
        list.appendChild(item);
      });
      list.scrollTop = list.scrollHeight;
    }

    function tutupKomentar() { document.getElementById('comment-drawer').style.display = 'none'; }
    function pilihEmoji() {
      const pick = prompt('Pilih emoji:\n1. 😊\n2. 😂\n3. 🔥\n4. ❤️\n5. 👍');
      const emojis = ['😊', '😂', '🔥', '❤️', '👍'];
      if (pick && emojis[pick - 1]) document.getElementById('input-komentar').value += emojis[pick - 1];
    }

    function ambilIdYoutube(url) {
      if (!url) return null;
      url = url.trim();
      const match = url.match(/(?:youtube\.com\/(?:shorts\/|watch\?v=)|youtu\.be\/|^)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : (url.length === 11 ? url : null);
    }

    async function simpanShortManual() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || ('@' + currentUser);
      const type = document.getElementById('video-type-input').value.trim().toLowerCase() || 'shorts';

      const id = ambilIdYoutube(input);
      if (!id) return alert('Link tidak valid! Pastikan link dari YouTube Shorts.');

      let title = 'Shorts';
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        const json = await res.json();
        title = json.title || 'Shorts';
      } catch (e) {}

      const videoData = {
        id, title, channel, type,
        ownerId: (svAuth && svAuth.currentUser) ? svAuth.currentUser.uid : 'local',
        ownerName: currentUser,
        ownerPhoto: currentPhotoURL,
        likes: 0,
        commentCount: 0,
        comments: []
      };

      videoList.unshift(videoData);
      allVideoList.unshift(videoData);
      localStorage.setItem('sv_videos', JSON.stringify(allVideoList));
      
      document.getElementById('video-id-input').value = '';
      tutupModal('add-modal');
      renderVideos();
      bukaHalaman('shorts');
    }

    function toggleLike(index, btn) {
      const v = videoList[index];
      v.liked = !v.liked;
      v.likes = (v.likes || 0) + (v.liked ? 1 : -1);
      btn.classList.toggle('active', v.liked);
      document.getElementById(`like-text-${index}`).innerText = v.likes;
    }

    function toggleSub(btn) {
      btn.classList.toggle('subscribed');
      btn.innerText = btn.classList.contains('subscribed') ? 'Disubscribe ✓' : 'Subscribe';
    }

    function bagikanLink() { navigator.clipboard.writeText(window.location.href); alert('Tautan disalin ke clipboard!'); }

    function tampilkanVideoSaya() {
      showMyVideos = true;
      const myUid = (svAuth && svAuth.currentUser) ? svAuth.currentUser.uid : 'local';
      videoList = allVideoList.filter(v => v.ownerId === myUid);
      renderVideos();
      document.getElementById('page-main').style.display = 'none';
      document.getElementById('page-shorts').style.display = 'block';
      document.getElementById('side-main').classList.remove('active');
      document.getElementById('side-shorts').classList.remove('active');
      document.getElementById('side-my-videos').classList.add('active');
    }

    async function startFirebase() {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        svDb = firebase.firestore();
        svAuth = firebase.auth();
        svStorage = firebase.storage();
        svFirebaseReady = true;

        svAuth.onAuthStateChanged(async user => {
          if (!user) return;
          const snap = await svDb.collection('users').doc(user.uid).get();
          if (snap.exists) {
            const data = snap.data();
            currentUser = data.name || currentUser;
            currentPhotoURL = data.photoURL || currentPhotoURL;
            tampilkanUserBadge(currentUser, currentPhotoURL);
          }
        });

        svDb.collection('videos').orderBy('createdAt', 'desc').onSnapshot(snap => {
          if (!snap.empty) {
            allVideoList = snap.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
            if (!showMyVideos) videoList = allVideoList.slice();
            renderVideos();
          }
        });
      } catch (err) {
        console.warn('Mode offline/lokal aktif.');
      }
    }

    startFirebase();
  </script>
