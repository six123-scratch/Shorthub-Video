<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ShortVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* ================= 1. NAVBAR ================= */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
    }

    .header-left { display: flex; align-items: center; gap: 16px; }
    
    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 19px; color: #fff; text-decoration: none;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 4px 8px; border-radius: 8px; display: flex; align-items: center;
    }

    .header-center { display: flex; align-items: center; width: 40%; max-width: 480px; }
    .search-box {
      width: 100%; padding: 8px 16px; border-radius: 20px 0 0 20px;
      border: 1px solid #303030; background: #121212; color: white; outline: none;
    }
    .search-btn {
      padding: 8px 18px; border-radius: 0 20px 20px 0;
      border: 1px solid #303030; border-left: none; background: #222; color: white; cursor: pointer;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .avatar-badge {
      display: none; width: 34px; height: 34px; border-radius: 50%;
      background-color: #00bcd4; color: #000; align-items: center; justify-content: center; font-weight: bold;
    }

    /* ================= 2. LAYOUT ================= */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    /* Sidebar Bersih Hanya Home (Ikon Vektor Buatan Sendiri) */
    .sidebar {
      width: 72px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 11px; color: #fff; cursor: pointer;
    }
    .side-icon-svg {
      width: 24px; height: 24px; fill: #ffffff;
    }

    /* Feed Shorts: Satu Layar Penuh Murni Format Shorts */
    .shorts-feed-wrapper {
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      display: block;
    }
    .shorts-feed-wrapper::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Bingkai Format 9:16 Khas Shorts */
    .video-frame {
      height: 88vh;
      max-height: 720px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
    }

    iframe { width: 100%; height: 100%; border: none; }

    /* Info Channel & Subscribe */
    .channel-overlay {
      position: absolute;
      bottom: 20px; left: 15px; right: 15px;
      color: white; z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 36px; height: 36px; border-radius: 50%; background: #e91e63;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Tombol Interaksi Kanan (Like, Dislike, Comment, Share) */
    .actions-bar {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      width: 48px; height: 48px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .action-btn:hover { background: #3f3f3f; transform: scale(1.1); }
    .action-btn.active svg { fill: #ff0000; }
    .action-btn svg { width: 22px; height: 22px; fill: #ffffff; transition: 0.2s; }
    .action-label { font-size: 12px; margin-top: 2px; text-align: center; }

    /* ================= 3. PANEL KOMENTAR AKTIF ================= */
    .comment-drawer {
      display: none; position: fixed; right: 0; bottom: 0;
      width: 380px; height: calc(100vh - 56px); background: #181818;
      border-left: 1px solid #303030; z-index: 90;
      flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .comment-header {
      padding: 16px; border-bottom: 1px solid #303030;
      display: flex; justify-content: space-between; align-items: center; font-weight: bold;
    }
    .comment-list {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .comment-item { font-size: 13px; line-height: 1.4; background: #222; padding: 10px; border-radius: 8px; }
    .comment-input-area {
      padding: 12px; border-top: 1px solid #303030; display: flex; gap: 8px;
    }
    .comment-input-area input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #444;
      background: #121212; color: white; outline: none;
    }
    .comment-input-area button {
      background: #ff0000; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
    }

    /* Popups Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-box input {
      padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="header-left">
      <div class="brand-logo">
        <span class="brand-icon">
          <!-- Vektor Play Icon -->
          <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
        </span>
        ShortVideo
      </div>
    </div>
    <div class="header-center">
      <input type="text" class="search-box" placeholder="Telusuri ShortVideo...">
      <button class="search-btn">🔍</button>
    </div>
    <div class="header-right">
      <button class="btn-create" onclick="bukaModal('add-modal')">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModal('auth-modal')">Buat Akun</button>
      <div class="avatar-badge" id="user-badge">U</div>
    </div>
  </header>

  <!-- LAYOUT UTAMA -->
  <div class="main-layout">
    
    <!-- Sidebar: Hanya Home (Ikon Vektor Buatan Sendiri) -->
    <div class="sidebar">
      <div class="side-item">
        <svg class="side-icon-svg" viewBox="0 0 24 24">
          <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
        </svg>
        Home
      </div>
    </div>

    <!-- Feed Shorts Vertikal -->
    <div class="shorts-feed-wrapper" id="feed-wrapper">
      
      <!-- Short 1 -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/jNQXAC9IVRw?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic">J</div>
              <span class="channel-name">@jawed</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Me at the zoo 🐘 #ShortVideo</div>
          </div>
        </div>
        
        <!-- Bar Tombol Interaksi Berfungsi -->
        <div class="actions-bar">
          <!-- Like -->
          <button class="action-btn" onclick="toggleLike(this)">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          </button>
          <span class="action-label" id="like-count-1">3.2 jt</span>

          <!-- Dislike -->
          <button class="action-btn" onclick="toggleDislike(this)">
            <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
          </button>
          <span class="action-label">Tidak suka</span>

          <!-- Comment -->
          <button class="action-btn" onclick="bukaKomentar()">
            <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
          </button>
          <span class="action-label">Komentar</span>

          <!-- Share -->
          <button class="action-btn" onclick="bagikanLink()">
            <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
          </button>
          <span class="action-label">Bagikan</span>
        </div>
      </div>

      <!-- Short 2 -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic" style="background:#4caf50;">R</div>
              <span class="channel-name">@RickMusic</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Never Gonna Give You Up! 🕺🎶</div>
          </div>
        </div>
        
        <div class="actions-bar">
          <button class="action-btn" onclick="toggleLike(this)">
            <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
          </button>
          <span class="action-label">18 jt</span>

          <button class="action-btn" onclick="toggleDislike(this)">
            <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
          </button>
          <span class="action-label">Tidak suka</span>

          <button class="action-btn" onclick="bukaKomentar()">
            <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
          </button>
          <span class="action-label">Komentar</span>

          <button class="action-btn" onclick="bagikanLink()">
            <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
          </button>
          <span class="action-label">Bagikan</span>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. PANEL KOMENTAR AKTIF -->
  <div class="comment-drawer" id="comment-drawer">
    <div class="comment-header">
      <span>Komentar</span>
      <button style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;" onclick="tutupKomentar()">✕</button>
    </div>
    <div class="comment-list" id="comment-list">
      <div class="comment-item"><strong>@budi_99:</strong> Keren banget videonya! 🔥</div>
      <div class="comment-item"><strong>@siti_gaming:</strong> Suka banget soundnya 😍</div>
    </div>
    <div class="comment-input-area">
      <input type="text" id="input-komentar" placeholder="Tulis komentar kamu...">
      <button onclick="kirimKomentar()">Kirim</button>
    </div>
  </div>

  <!-- POPUP BUAT AKUN -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3>Buat Akun ShortVideo</h3>
      <input type="text" id="username-input" placeholder="Masukkan Nama Akun">
      <button class="modal-btn" onclick="buatAkun()">Simpan Akun</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Batal</button>
    </div>
  </div>

  <!-- POPUP TAMBAH VIDEO -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambah ShortVideo</h3>
      <input type="text" id="video-id-input" placeholder="Link / ID YouTube Shorts">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (@NamaKamu)">
      <button class="modal-btn" onclick="tambahVideo()">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIKA LENGKAP -->
  <script>
    let currentUser = "Tamu";

    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    // Fitur Like Berfungsi
    function toggleLike(btn) {
      btn.classList.toggle('active');
    }

    // Fitur Dislike Berfungsi
    function toggleDislike(btn) {
      btn.classList.toggle('active');
    }

    // Fitur Subscribe Berfungsi
    function toggleSub(btn) {
      if (btn.classList.contains('subscribed')) {
        btn.classList.remove('subscribed');
        btn.innerText = 'Subscribe';
      } else {
        btn.classList.add('subscribed');
        btn.innerText = 'Disubscribe ✓';
      }
    }

    // Fitur Komentar Nyata
    function bukaKomentar() {
      document.getElementById('comment-drawer').style.display = 'flex';
    }
    function tutupKomentar() {
      document.getElementById('comment-drawer').style.display = 'none';
    }
    function kirimKomentar() {
      const input = document.getElementById('input-komentar');
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById('comment-list');
      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `<strong>@${currentUser}:</strong> ${text}`;
      list.appendChild(item);
      input.value = '';
      list.scrollTop = list.scrollHeight;
    }

    // Fitur Share Nyata
    function bagikanLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Tautan ShortVideo berhasil disalin ke clipboard! 📋');
    }

    // Fitur Buat Akun
    function buatAkun() {
      const name = document.getElementById('username-input').value.trim();
      if (!name) return alert('Masukkan nama kamu!');
      currentUser = name;
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      badge.innerText = name.charAt(0).toUpperCase();
      tutupModal('auth-modal');
      alert('Akun @' + name + ' berhasil dibuat!');
    }

    // Fitur Tambah Video
    function tambahVideo() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || '@Creator';
      if (!input) return alert('Masukkan link video!');

      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];

      const wrapper = document.getElementById('feed-wrapper');
      const newCard = document.createElement('div');
      newCard.className = 'short-container';
      newCard.innerHTML = `
        <div class="video-frame">
          <iframe 
            src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&mute=1&playsinline=1" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
          <div class="channel-overlay">
            <div class="channel-header">
              <div class="channel-pic" style="background:#ff9800;">${channel.charAt(1).toUpperCase()}</div>
              <span class="channel-name">${channel}</span>
              <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
            </div>
            <div class="video-title">Video baru di ShortVideo! 🔥</div>
          </div>
        </div>
        <div class="actions-bar">
          <button class="action-btn" onclick="toggleLike(this)"><svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg></button>
          <span class="action-label">1</span>
          <button class="action-btn" onclick="toggleDislike(this)"><svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg></button>
          <button class="action-btn" onclick="bukaKomentar()"><svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg></button>
          <button class="action-btn" onclick="bagikanLink()"><svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg></button>
        </div>
      `;
      wrapper.appendChild(newCard);
      document.getElementById('video-id-input').value = '';
      tutupModal('add-modal');
      newCard.scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
