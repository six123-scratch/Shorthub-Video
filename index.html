<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ShortVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 1. NAVBAR */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 19px; color: #fff; cursor: pointer;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 4px 8px; border-radius: 8px; display: flex; align-items: center;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .btn-logout { display:none; background:#272727; color:#fff; border:0; padding:8px 14px; border-radius:18px; cursor:pointer; }
    .avatar-badge {
      display: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      background-color: #00bcd4; color: #fff; align-items: center; justify-content: center; font-weight: bold;
      background-size: cover; background-position: center; border: 2px solid #333;
    }
    .delete-video { position:absolute; top:14px; right:14px; z-index:8; border:0; border-radius:16px; padding:7px 10px; background:rgba(0,0,0,.75); color:#fff; cursor:pointer; }

    /* 2. LAYOUT */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .sidebar {
      width: 76px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      gap: 20px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 11px; color: #aaa; cursor: pointer; width: 100%; padding: 8px 0;
    }
    .side-item:hover, .side-item.active { color: #fff; font-weight: bold; }
    .side-item.active svg { fill: #ff0000; }
    .side-icon-svg { width: 24px; height: 24px; fill: #ffffff; }

    /* HALAMAN MAIN */
    #page-main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .main-title { font-size: 36px; font-weight: bold; margin-bottom: 25px; color: #ffffff; }
    .main-buttons-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-main-action {
      padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-main-play { background-color: #ff0000; color: white; }
    .btn-main-play:hover { background-color: #cc0000; transform: scale(1.05); }
    .btn-main-add { background-color: #272727; color: white; }
    .btn-main-add:hover { background-color: #3f3f3f; transform: scale(1.05); }

    /* HALAMAN SHORTS */
    #page-shorts {
      display: none;
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #page-shorts::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .video-frame {
      height: 88vh;
      max-height: 720px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Channel Overlay */
    .channel-overlay {
      position: absolute;
      bottom: 20px; left: 15px; right: 15px;
      color: white; z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 38px; height: 38px; border-radius: 50%; background-color: #ff5722;
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      border: 1.5px solid rgba(255,255,255,0.7); flex-shrink: 0;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Actions Bar */
    .actions-bar {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      width: 48px; height: 48px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .action-btn:hover { background: #3f3f3f; }
    .action-btn.active svg { fill: #ff0000; }
    .action-btn svg { width: 22px; height: 22px; fill: #ffffff; }
    .action-label { font-size: 12px; margin-top: 2px; }

    /* Drawer Komentar */
    .comment-drawer {
      display: none; position: fixed; right: 0; bottom: 0;
      width: 360px; height: calc(100vh - 56px); background: #181818;
      border-left: 1px solid #303030; z-index: 90;
      flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .comment-header {
      padding: 16px; border-bottom: 1px solid #303030;
      display: flex; justify-content: space-between; align-items: center; font-weight: bold;
    }
    .comment-list {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px;
    }
    .comment-item { font-size: 13px; background: #222; padding: 10px; border-radius: 8px; display:flex; align-items:center; gap:8px; }
    .comment-avatar { 
      width:28px; height:28px; border-radius:50%; background:#ff5722 center/cover no-repeat; 
      display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:bold; 
    }
    .comment-input-area {
      padding: 12px; border-top: 1px solid #303030; display: flex; gap: 8px;
    }
    .comment-input-area input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #444;
      background: #121212; color: white; outline: none;
    }
    .comment-input-area button {
      background: #ff0000; color: white; border: none; padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-box input {
      padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="brand-logo" onclick="bukaHalaman('main')">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </span>
      ShortVideo
    </div>
    <div class="header-right">
      <button type="button" class="btn-create" onclick="document.getElementById('add-modal').style.display='flex'">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModal('auth-modal')">Buat Akun</button>
      <div class="avatar-badge" id="user-badge" onclick="bukaModal('auth-modal')" title="Profil Pengguna"></div>
      <button type="button" class="btn-logout" id="logout-btn" onclick="keluarAkun()">Keluar</button>
    </div>
  </header>

  <!-- LAYOUT UTAMA -->
  <div class="main-layout">
    <div class="sidebar">
      <div class="side-item active" id="side-main" onclick="bukaHalaman('main')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Main
      </div>
      <div class="side-item" id="side-shorts" onclick="bukaHalaman('shorts')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        Shorts
      </div>
      <div class="side-item" id="side-my-videos" onclick="tampilkanVideoSaya()">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h10v4H4v-4z"/></svg>
        Tambahanku
      </div>
    </div>

    <!-- 1. HALAMAN MAIN -->
    <div id="page-main">
      <div class="main-title">Nonton Short apa?</div>
      <div class="main-buttons-group">
        <button class="btn-main-action btn-main-play" onclick="bukaHalaman('shorts')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          Nonton Shorts
        </button>
        <button type="button" class="btn-main-action btn-main-add" onclick="document.getElementById('add-modal').style.display='flex'">
          ＋ Tambahkan Short
        </button>
      </div>
      <p id="empty-info" style="color: #777; margin-top: 25px; font-size: 14px;">Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!</p>
    </div>

    <!-- 2. HALAMAN SHORTS -->
    <div id="page-shorts"></div>
  </div>

  <!-- PANEL KOMENTAR -->
  <div class="comment-drawer" id="comment-drawer">
    <div class="comment-header">
      <span id="comment-title">Komentar</span>
      <button style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;" onclick="tutupKomentar()">✕</button>
    </div>
    <div class="comment-list" id="comment-list"></div>
    <div class="comment-input-area">
      <input type="text" id="input-komentar" placeholder="Tulis komentar kamu...">
      <button type="button" onclick="pilihEmoji()" style="background:#333">😊</button>
      <button type="button" onclick="kirimKomentar()">Kirim</button>
    </div>
  </div>

  <!-- POPUP BUAT AKUN -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3>Akun ShortVideo</h3>
      <input type="text" id="username-input" placeholder="Nama tampilan">
      <input type="email" id="email-input" placeholder="Email">
      <input type="password" id="password-input" placeholder="Password minimal 6 karakter">
      <label style="font-size:12px; color:#aaa; margin-top:-6px;">Foto Profil:</label>
      <input type="file" id="profile-photo-input" accept="image/*" style="color:#bbb; padding: 6px;">
      <button class="modal-btn" type="button" onclick="buatAkunEmail()">Daftar Akun Baru</button>
      <button class="modal-btn" type="button" style="background:#333" onclick="masukAkun()">Masuk</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Batal</button>
    </div>
  </div>

  <!-- POPUP TAMBAH SHORTS -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambahkan Short Baru</h3>
      <input type="text" id="video-id-input" placeholder="Link YouTube Shorts (youtube.com/shorts/...)">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (misal: @Kreator)">
      <input type="text" id="video-type-input" placeholder="Tipe video, misalnya gaming, komedi">
      <button type="button" class="modal-btn" id="btn-tambah-video" onclick="simpanShortManual()">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script>
    var currentUser = localStorage.getItem('sv_user') || 'Tamu';
    var currentPhotoURL = localStorage.getItem('sv_photo') || '';
    var videoList = JSON.parse(localStorage.getItem('sv_videos')) || [];
    var allVideoList = videoList.slice();
    var showMyVideos = false;
    var activeVideoIndex = 0;
    const DEFAULT_SHORTS = [{ id:'nDKx7mM7LYc', channel:'Shorts pilihan', type:'shorts', tags:['shorts'], likes:0, dislikes:0, comments:[], ownerPhoto: '' }];

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCaXYmvDEmHFSaUd10R4acs2cHT4Ma0mwg",
      authDomain: "shortvideo-8788a.firebaseapp.com",
      projectId: "shortvideo-8788a",
      storageBucket: "shortvideo-8788a.firebasestorage.app",
      messagingSenderId: "101344146346",
      appId: "1:101344146346:web:1a46973c68993b13e4f1d3",
      measurementId: "G-E1PYNV736D"
    };

    let svDb = null, svAuth = null, svStorage = null, svFirebaseReady = false;

    function svEscape(value) { 
      return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
    }

    // Tampilkan Avatar Pengguna di Navbar
    function tampilkanUserBadge(name, photoURL) {
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      
      const photo = photoURL || currentPhotoURL;
      if (photo) {
        badge.style.backgroundImage = `url("${photo}")`;
        badge.innerText = '';
      } else {
        badge.style.backgroundImage = 'none';
        badge.innerText = (name || 'U').charAt(0).toUpperCase();
      }

      const logout = document.getElementById('logout-btn');
      if (logout) logout.style.display = 'inline-block';
    }

    if (localStorage.getItem('sv_user')) {
      tampilkanUserBadge(currentUser, currentPhotoURL);
    }

    function bukaHalaman(halaman) {
      tutupKomentar();
      if (halaman === 'main') {
        document.getElementById('page-main').style.display = 'flex';
        document.getElementById('page-shorts').style.display = 'none';
        document.getElementById('side-main').classList.add('active');
        document.getElementById('side-shorts').classList.remove('active');
        document.getElementById('side-my-videos').classList.remove('active');
        
        // Pause semua video saat kembali ke menu
        document.querySelectorAll('iframe').forEach(frame => svYouTubeCommand(frame, 'pauseVideo'));
      } else {
        if (videoList.length === 0) {
          alert('Belum ada video! Silakan tambahkan video terlebih dahulu.');
          bukaModal('add-modal');
          return;
        }
        showMyVideos = false;
        videoList = allVideoList.slice();
        document.getElementById('page-main').style.display = 'none';
        document.getElementById('page-shorts').style.display = 'block';
        document.getElementById('side-main').classList.remove('active');
        document.getElementById('side-shorts').classList.add('active');
        document.getElementById('side-my-videos').classList.remove('active');

        // Mainkan video pertama langsung
        setTimeout(() => {
          const firstIframe = document.querySelector('.short-container iframe');
          if (firstIframe) svYouTubeCommand(firstIframe, 'playVideo');
        }, 300);
      }
    }

    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    // Kirim Perintah ke YouTube Player
    function svYouTubeCommand(iframe, func, args=[]) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args}), '*');
    }

    // Render Video Feed
    function renderVideos() {
      const feed = document.getElementById('page-shorts');
      feed.innerHTML = '';

      if (videoList.length === 0) {
        document.getElementById('empty-info').innerText = 'Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!';
        return;
      }

      document.getElementById('empty-info').innerText = `Ada ${videoList.length} video tersimpan siap ditonton!`;

      videoList.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'short-container';
        card.dataset.index = index;

        // Cek foto profil kreator
        const creatorPicStyle = v.ownerPhoto 
          ? `background-image: url('${v.ownerPhoto}');` 
          : '';
        const creatorPicInitial = v.ownerPhoto 
          ? '' 
          : svEscape((v.channel || '@Kreator').replace('@','').charAt(0).toUpperCase());

        card.innerHTML = `
          <div class="video-frame">
            ${v.ownerId && svAuth && svAuth.currentUser && v.ownerId === svAuth.currentUser.uid ? `<button class="delete-video" onclick="hapusVideo(${index}); event.stopPropagation();">Hapus</button>` : ''}
            
            <!-- Menggunakan autoplay=1&mute=1 agar browser langsung memutar tanpa diblokir -->
            <iframe 
              src="https://www.youtube.com/embed/${v.id}?enablejsapi=1&autoplay=1&mute=1&playsinline=1&controls=0&loop=1&playlist=${v.id}&rel=0" 
              allow="autoplay; accelerometer; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>

            <div class="channel-overlay">
              <div class="channel-header">
                <div class="channel-pic" style="${creatorPicStyle}">${creatorPicInitial}</div>
                <span class="channel-name">${svEscape(v.channel)}</span>
                <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
              </div>
              <div style="font-size:13px;">${svEscape(v.title || 'Shorts')}</div>
            </div>
          </div>

          <div class="actions-bar">
            <!-- Tombol Suara (Unmute / Mute) -->
            <button class="action-btn" onclick="toggleMuteVideo(this)" title="Bunyikan Video">
              <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>

            <!-- Like -->
            <button class="action-btn ${v.liked ? 'active' : ''}" onclick="toggleLike(${index}, this)">
              <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
            </button>
            <span class="action-label" id="like-text-${index}">${v.likes || 0}</span>

            <!-- Dislike -->
            <button class="action-btn" onclick="toggleDislike(${index})">
              <svg viewBox="0 0 24 24"><path d="M15 3H6c-.83 0-1.54.5-1.84 1.22l-3.02 7.05c-.09.23-.14.47-.14.73v2c0 1.1.9 2 2 2h6.31l-.95 4.57-.03.32c0 .41.17.79.44 1.06L9.83 23l6.59-6.59c.37-.36.58-.86.58-1.41V5c0-1.1-.9-2-2-2zm4 0v12h4V3h-4z"/></svg>
            </button>

            <!-- Komentar -->
            <button class="action-btn" onclick="bukaKomentar(${index})">
              <svg viewBox="0 0 24 24"><path d="M21.99 4c0-1.1-.89-2-1.99-2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4-.01-18z"/></svg>
            </button>
            <span class="action-label">${(v.comments && v.comments.length) || 0}</span>

            <!-- Bagikan -->
            <button class="action-btn" onclick="bagikanLink()">
              <svg viewBox="0 0 24 24"><path d="M14 9V5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11z"/></svg>
            </button>
          </div>
        `;
        feed.appendChild(card);
      });

      setupObserver();
    }

    // Toggle Suara Video
    function toggleMuteVideo(btn) {
      const card = btn.closest('.short-container');
      const iframe = card.querySelector('iframe');
      if (btn.classList.toggle('unmuted')) {
        svYouTubeCommand(iframe, 'unMute');
        btn.style.color = '#ff0000';
      } else {
        svYouTubeCommand(iframe, 'mute');
        btn.style.color = '#fff';
      }
    }

    // Observer: Otomatis play saat digulir, pause saat keluar
    function setupObserver() {
      const cards = document.querySelectorAll('.short-container');
      const observer = new IntersectionObserver(entries => {
        entries.forEach(entry => {
          const iframe = entry.target.querySelector('iframe');
          if (!iframe) return;
          if (entry.isIntersecting) {
            svYouTubeCommand(iframe, 'playVideo');
          } else {
            svYouTubeCommand(iframe, 'pauseVideo');
          }
        });
      }, { threshold: 0.6 });

      cards.forEach(card => observer.observe(card));
    }

    // Kompresi Foto Profil (Canvas)
    function kompresFoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const scale = Math.min(1, 200 / Math.max(img.width, img.height));
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', 0.8));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // Buat Akun & Upload Foto
    async function buatAkunEmail() {
      const name = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const file = document.getElementById('profile-photo-input').files[0];

      if (!name || !email || password.length < 6) {
        return alert('Isi nama, email, dan password minimal 6 karakter.');
      }

      let photoURL = '';
      if (file) {
        photoURL = await kompresFoto(file);
      }

      if (svFirebaseReady && svAuth) {
        try {
          const result = await svAuth.createUserWithEmailAndPassword(email, password);
          if (file && svStorage) {
            try {
              const task = await svStorage.ref(`profiles/${result.user.uid}.jpg`).putString(photoURL, 'data_url');
              photoURL = await task.ref.getDownloadURL();
            } catch (e) {
              console.log('Pakai Data URL lokal karena storage limit.');
            }
          }
          await svDb.collection('users').doc(result.user.uid).set({
            name, email, photoURL, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } catch (error) {
          return alert('Gagal buat akun: ' + error.message);
        }
      }

      currentUser = name;
      currentPhotoURL = photoURL;
      localStorage.setItem('sv_user', name);
      localStorage.setItem('sv_photo', photoURL);

      tampilkanUserBadge(name, photoURL);
      tutupModal('auth-modal');
      renderVideos();
      alert('Akun berhasil dibuat!');
    }

    // Masuk Akun
    async function masukAkun() {
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      if (!email || !password) return alert('Masukkan email dan password.');

      if (svFirebaseReady && svAuth) {
        try {
          const result = await svAuth.signInWithEmailAndPassword(email, password);
          const snap = await svDb.collection('users').doc(result.user.uid).get();
          const profile = snap.exists ? snap.data() : {};
          currentUser = profile.name || email.split('@')[0];
          currentPhotoURL = profile.photoURL || '';
        } catch (e) {
          return alert('Gagal login: ' + e.message);
        }
      } else {
        currentUser = email.split('@')[0];
      }

      localStorage.setItem('sv_user', currentUser);
      localStorage.setItem('sv_photo', currentPhotoURL);
      tampilkanUserBadge(currentUser, currentPhotoURL);
      tutupModal('auth-modal');
      renderVideos();
    }

    async function keluarAkun() {
      if (svFirebaseReady && svAuth) await svAuth.signOut();
      localStorage.removeItem('sv_user');
      localStorage.removeItem('sv_photo');
      location.reload();
    }

    // Tambah Video
    async function simpanShortManual() {
      const input = document.getElementById('video-id-input').value.trim();
      const channel = document.getElementById('video-channel-input').value.trim() || ('@' + currentUser);
      const type = document.getElementById('video-type-input').value.trim().toLowerCase() || 'shorts';

      if (!input) return alert('Silakan masukkan link Shorts!');

      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];

      let title = 'Shorts';
      try {
        const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${id}&format=json`);
        const json = await res.json();
        title = json.title || 'Shorts';
      } catch (e) {}

      const videoData = {
        id,
        title,
        channel,
        type,
        ownerId: (svAuth && svAuth.currentUser) ? svAuth.currentUser.uid : 'local',
        ownerName: currentUser,
        ownerPhoto: currentPhotoURL,
        likes: 0,
        comments: []
      };

      if (svFirebaseReady && svDb) {
        await svDb.collection('videos').add({
          ...videoData,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } else {
        videoList.unshift(videoData);
        allVideoList.unshift(videoData);
        localStorage.setItem('sv_videos', JSON.stringify(allVideoList));
        renderVideos();
      }

      document.getElementById('video-id-input').value = '';
      tutupModal('add-modal');
      bukaHalaman('shorts');
    }

    function toggleSub(btn) {
      btn.classList.toggle('subscribed');
      btn.innerText = btn.classList.contains('subscribed') ? 'Disubscribe ✓' : 'Subscribe';
    }

    function toggleLike(index, btn) {
      const v = videoList[index];
      v.liked = !v.liked;
      v.likes = (v.likes || 0) + (v.liked ? 1 : -1);
      btn.classList.toggle('active', v.liked);
      document.getElementById(`like-text-${index}`).innerText = v.likes;
      localStorage.setItem('sv_videos', JSON.stringify(allVideoList));
    }

    function toggleDislike(index) {
      alert('Kamu tidak menyukai video ini.');
    }

    function bukaKomentar(index) {
      activeVideoIndex = index;
      const drawer = document.getElementById('comment-drawer');
      const list = document.getElementById('comment-list');
      list.innerHTML = '';

      const v = videoList[index];
      if (!v.comments || v.comments.length === 0) {
        list.innerHTML = '<div style="color:#777; font-size:13px; text-align:center; padding:20px;">Belum ada komentar.</div>';
      } else {
        v.comments.forEach(c => {
          const item = document.createElement('div');
          item.className = 'comment-item';
          item.innerHTML = `
            <div class="comment-avatar" style="${c.photoURL ? `background-image:url('${c.photoURL}')` : ''}">${c.photoURL ? '' : (c.user||'U').charAt(0).toUpperCase()}</div>
            <div><strong>@${svEscape(c.user)}:</strong> ${svEscape(c.text)}</div>
          `;
          list.appendChild(item);
        });
      }
      drawer.style.display = 'flex';
    }

    function tutupKomentar() { document.getElementById('comment-drawer').style.display = 'none'; }

    function kirimKomentar() {
      const input = document.getElementById('input-komentar');
      const text = input.value.trim();
      if (!text) return;

      const v = videoList[activeVideoIndex];
      if (!v.comments) v.comments = [];
      v.comments.push({ user: currentUser, text: text, photoURL: currentPhotoURL });

      localStorage.setItem('sv_videos', JSON.stringify(allVideoList));
      input.value = '';
      bukaKomentar(activeVideoIndex);
    }

    function pilihEmoji() {
      const emojis = ['😊', '😂', '🔥', '❤️', '👍', '🎉', '🙌'];
      const pick = prompt('Pilih nomor emoji:\n' + emojis.map((e, i) => `${i+1}. ${e}`).join('\n'));
      if (pick && emojis[pick - 1]) {
        document.getElementById('input-komentar').value += emojis[pick - 1];
      }
    }

    function bagikanLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Tautan disalin ke clipboard!');
    }

    function tampilkanVideoSaya() {
      showMyVideos = true;
      const myUid = (svAuth && svAuth.currentUser) ? svAuth.currentUser.uid : 'local';
      videoList = allVideoList.filter(v => v.ownerId === myUid);
      renderVideos();
      document.getElementById('page-main').style.display = 'none';
      document.getElementById('page-shorts').style.display = 'block';
      document.getElementById('side-main').classList.remove('active');
      document.getElementById('side-shorts').classList.remove('active');
      document.getElementById('side-my-videos').classList.add('active');
    }

    // Inisialisasi Firebase
    async function startFirebase() {
      try {
        firebase.initializeApp(FIREBASE_CONFIG);
        svDb = firebase.firestore();
        svAuth = firebase.auth();
        svStorage = firebase.storage();
        svFirebaseReady = true;

        svAuth.onAuthStateChanged(async user => {
          if (!user) return;
          const snap = await svDb.collection('users').doc(user.uid).get();
          if (snap.exists) {
            const data = snap.data();
            currentUser = data.name || currentUser;
            currentPhotoURL = data.photoURL || currentPhotoURL;
            tampilkanUserBadge(currentUser, currentPhotoURL);
          }
        });

        svDb.collection('videos').orderBy('createdAt', 'desc').onSnapshot(snap => {
          if (!snap.empty) {
            allVideoList = snap.docs.map(doc => ({ firebaseId: doc.id, ...doc.data() }));
            if (!showMyVideos) videoList = allVideoList.slice();
            renderVideos();
          }
        });
      } catch (err) {
        console.warn('Menjalankan dalam mode lokal offline.');
      }
    }

    startFirebase();
    renderVideos();
  </script>
</body>
