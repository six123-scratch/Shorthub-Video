<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Feed YouTube Shorts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    /* Wadah Scroll Vertikal */
    .shorts-container {
      width: 100%;
      max-width: 400px; /* Ukuran pas untuk layar vertikal */
      height: 100vh;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .shorts-container::-webkit-scrollbar { display: none; }

    /* Kartu Setiap Video */
    .video-card {
      position: relative;
      width: 100%;
      height: 100vh;
      scroll-snap-align: start;
      background-color: #000;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Pemutar YouTube agar Pas di Layar */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 12px;
    }
  </style>
</head>
<body>

  <div class="shorts-container">

    <!-- Video YouTube Shorts 1 -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/jNQXAC9IVRw?rel=0" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

    <!-- Video YouTube Shorts 2 -->
    <div class="video-card">
      <iframe 
        src="https://www.youtube.com/embed/dQw4w9WgXcQ?rel=0" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        allowfullscreen>
      </iframe>
    </div>

  </div>

</body>
</html>
