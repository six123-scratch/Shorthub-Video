<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>ShortVideo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* 1. NAVBAR */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 20px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 100;
      flex-shrink: 0;
    }

    .brand-logo {
      display: flex; align-items: center; gap: 8px;
      font-weight: bold; font-size: 19px; color: #fff; cursor: pointer;
    }
    .brand-icon {
      background-color: #ff0000; color: white;
      padding: 4px 8px; border-radius: 8px; display: flex; align-items: center;
    }

    .header-right { display: flex; align-items: center; gap: 12px; }
    .btn-create {
      background-color: #272727; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: 500;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .btn-auth {
      background-color: #ff0000; color: white; border: none;
      padding: 8px 16px; border-radius: 18px; font-size: 14px; cursor: pointer; font-weight: bold;
    }
    .btn-logout { display:none; background:#272727; color:#fff; border:0; padding:8px 14px; border-radius:18px; cursor:pointer; }
    .avatar-badge {
      display: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer;
      background-color: #00bcd4; color: #fff; align-items: center; justify-content: center; font-weight: bold;
      background-size: cover; background-position: center; border: 2px solid #ff0000;
    }
    .delete-video { position:absolute; top:14px; right:14px; z-index:8; border:0; border-radius:16px; padding:7px 10px; background:rgba(0,0,0,.75); color:#fff; cursor:pointer; }

    /* 2. LAYOUT */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
      overflow: hidden;
    }

    .sidebar {
      width: 76px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 16px;
      gap: 20px;
      flex-shrink: 0;
      border-right: 1px solid #1a1a1a;
    }
    .side-item {
      display: flex; flex-direction: column; align-items: center;
      gap: 6px; font-size: 11px; color: #aaa; cursor: pointer; width: 100%; padding: 8px 0;
    }
    .side-item:hover, .side-item.active { color: #fff; font-weight: bold; }
    .side-item.active svg { fill: #ff0000; }
    .side-icon-svg { width: 24px; height: 24px; fill: #ffffff; }

    /* HALAMAN MAIN */
    #page-main {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
    }
    .main-title { font-size: 36px; font-weight: bold; margin-bottom: 25px; color: #ffffff; }
    .main-buttons-group { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
    .btn-main-action {
      padding: 14px 28px; font-size: 16px; font-weight: bold; border-radius: 25px; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: 0.2s;
    }
    .btn-main-play { background-color: #ff0000; color: white; }
    .btn-main-play:hover { background-color: #cc0000; transform: scale(1.05); }
    .btn-main-add { background-color: #272727; color: white; }
    .btn-main-add:hover { background-color: #3f3f3f; transform: scale(1.05); }

    /* HALAMAN SHORTS */
    #page-shorts {
      display: none;
      flex: 1;
      height: 100%;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    #page-shorts::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      scroll-snap-stop: always;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .video-frame {
      height: 88vh;
      max-height: 720px;
      aspect-ratio: 9 / 16;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
      box-shadow: 0 4px 25px rgba(0,0,0,0.8);
    }
    iframe { width: 100%; height: 100%; border: none; }

    /* Channel Overlay */
    .channel-overlay {
      position: absolute;
      bottom: 20px; left: 15px; right: 15px;
      color: white; z-index: 5;
      text-shadow: 1px 1px 4px rgba(0,0,0,0.8);
      pointer-events: none;
    }
    .channel-header {
      display: flex; align-items: center; gap: 10px; margin-bottom: 8px; pointer-events: auto;
    }
    .channel-pic {
      width: 38px; height: 38px; border-radius: 50%; background-color: #ff5722;
      background-size: cover; background-position: center;
      display: flex; align-items: center; justify-content: center; font-weight: bold;
      border: 1.5px solid rgba(255,255,255,0.7); flex-shrink: 0;
    }
    .btn-subscribe {
      background-color: #ff0000; color: white; border: none;
      padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer;
    }
    .btn-subscribe.subscribed { background-color: #333; color: #aaa; }

    /* Actions Bar */
    .actions-bar {
      margin-left: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .action-btn {
      width: 48px; height: 48px; border-radius: 50%; background: #272727;
      display: flex; justify-content: center; align-items: center; color: white;
      cursor: pointer; transition: 0.2s; border: none;
    }
    .action-btn:hover { background: #3f3f3f; }
    .action-btn.active svg { fill: #ff0000; }
    .action-btn svg { width: 22px; height: 22px; fill: #ffffff; }
    .action-label { font-size: 12px; margin-top: 2px; }

    /* Drawer Komentar */
    .comment-drawer {
      display: none; position: fixed; right: 0; bottom: 0;
      width: 360px; height: calc(100vh - 56px); background: #181818;
      border-left: 1px solid #303030; z-index: 90;
      flex-direction: column; box-shadow: -4px 0 20px rgba(0,0,0,0.5);
    }
    .comment-header {
      padding: 16px; border-bottom: 1px solid #303030;
      display: flex; justify-content: space-between; align-items: center; font-weight: bold;
    }
    .comment-list {
      flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
    }
    .comment-item { font-size: 13px; background: #222; padding: 10px; border-radius: 8px; display:flex; gap:10px; align-items: flex-start; }
    .comment-avatar { 
      width:32px; height:32px; border-radius:50%; background:#ff5722 center/cover no-repeat; 
      display:flex; align-items:center; justify-content:center; flex-shrink:0; font-weight:bold; font-size: 12px;
    }
    .comment-content { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .comment-gif { max-width: 180px; border-radius: 8px; margin-top: 4px; display: block; }
    
    /* Panel GIF Picker */
    .gif-picker {
      display: none; background: #222; padding: 10px; border-top: 1px solid #333;
      gap: 8px; overflow-x: auto; white-space: nowrap;
    }
    .gif-picker img {
      width: 75px; height: 55px; object-fit: cover; border-radius: 6px; cursor: pointer; border: 1px solid #444;
    }
    .gif-picker img:hover { transform: scale(1.05); border-color: #ff0000; }

    .comment-input-area {
      padding: 12px; border-top: 1px solid #303030; display: flex; gap: 8px; align-items: center;
    }
    .comment-input-area input {
      flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #444;
      background: #121212; color: white; outline: none;
    }
    .comment-input-area button {
      background: #ff0000; color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px;
    }

    /* Modal */
    .modal {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
    }
    .modal-box {
      background: #212121; padding: 24px; border-radius: 16px; width: 90%; max-width: 380px;
      display: flex; flex-direction: column; gap: 15px;
    }
    .modal-box input {
      padding: 12px; border-radius: 8px; border: 1px solid #444; background: #121212; color: white; outline: none;
    }
    .modal-btn {
      background: #ff0000; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;
    }
    .profile-preview {
      width: 70px; height: 70px; border-radius: 50%; margin: 0 auto; background: #333 center/cover no-repeat; border: 2px solid #555;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <header>
    <div class="brand-logo" onclick="bukaHalaman('main')">
      <span class="brand-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
      </span>
      ShortVideo
    </div>
    <div class="header-right">
      <button type="button" class="btn-create" onclick="document.getElementById('add-modal').style.display='flex'">＋ Tambah</button>
      <button class="btn-auth" id="auth-btn" onclick="bukaModalAuth()">Masuk / Akun</button>
      <div class="avatar-badge" id="user-badge" onclick="bukaModalAuth()" title="Profil Saya"></div>
      <button type="button" class="btn-logout" id="logout-btn" onclick="keluarAkun()">Keluar</button>
    </div>
  </header>

  <!-- LAYOUT UTAMA -->
  <div class="main-layout">
    <div class="sidebar">
      <div class="side-item active" id="side-main" onclick="bukaHalaman('main')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Main
      </div>
      <div class="side-item" id="side-shorts" onclick="bukaHalaman('shorts')">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
        Shorts
      </div>
      <div class="side-item" id="side-my-videos" onclick="tampilkanVideoSaya()">
        <svg class="side-icon-svg" viewBox="0 0 24 24"><path d="M4 4h16v4H4V4zm0 6h16v4H4v-4zm0 6h10v4H4v-4z"/></svg>
        Tambahanku
      </div>
    </div>

    <!-- 1. HALAMAN MAIN -->
    <div id="page-main">
      <div class="main-title">Nonton Short apa?</div>
      <div class="main-buttons-group">
        <button class="btn-main-action btn-main-play" onclick="bukaHalaman('shorts')">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg>
          Nonton Shorts
        </button>
        <button type="button" class="btn-main-action btn-main-add" onclick="document.getElementById('add-modal').style.display='flex'">
          ＋ Tambahkan Short
        </button>
      </div>
      <p id="empty-info" style="color: #777; margin-top: 25px; font-size: 14px;">Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!</p>
    </div>

    <!-- 2. HALAMAN SHORTS -->
    <div id="page-shorts"></div>
  </div>

  <!-- PANEL KOMENTAR -->
  <div class="comment-drawer" id="comment-drawer">
    <div class="comment-header">
      <span id="comment-title">Komentar</span>
      <button style="background:none; border:none; color:#aaa; font-size:18px; cursor:pointer;" onclick="tutupKomentar()">✕</button>
    </div>
    
    <div class="comment-list" id="comment-list"></div>

    <!-- PILIHAN GIF -->
    <div class="gif-picker" id="gif-picker">
      <img src="https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif" onclick="kirimGif(this.src)" alt="Clap">
      <img src="https://media.giphy.com/media/l3q2K5jinAlChoCLS/giphy.gif" onclick="kirimGif(this.src)" alt="Wow">
      <img src="https://media.giphy.com/media/10UeedrT5MIfPG/giphy.gif" onclick="kirimGif(this.src)" alt="Laugh">
      <img src="https://media.giphy.com/media/3o7abKhOpu0NwenH3O/giphy.gif" onclick="kirimGif(this.src)" alt="Thumbs up">
      <img src="https://media.giphy.com/media/xT9IgzoKnwFNmISR8I/giphy.gif" onclick="kirimGif(this.src)" alt="Fire">
      <img src="https://media.giphy.com/media/d2lcHJTG5Tscg/giphy.gif" onclick="kirimGif(this.src)" alt="Cry">
    </div>

    <div class="comment-input-area">
      <input type="text" id="input-komentar" placeholder="Tulis komentar kamu...">
      <button type="button" onclick="toggleGifPicker()" style="background:#2f2f2f">GIF</button>
      <button type="button" onclick="pilihEmoji()" style="background:#2f2f2f">😊</button>
      <button type="button" onclick="kirimKomentar()">Kirim</button>
    </div>
  </div>

  <!-- POPUP AKUN / EDIT PROFIL -->
  <div class="modal" id="auth-modal">
    <div class="modal-box">
      <h3 id="auth-modal-title">Profil & Akun</h3>
      <div class="profile-preview" id="modal-photo-preview"></div>
      
      <input type="text" id="username-input" placeholder="Nama tampilan / Username">
      <div id="auth-fields">
        <input type="email" id="email-input" placeholder="Email (untuk login)">
        <input type="password" id="password-input" placeholder="Password minimal 6 karakter">
      </div>
      
      <label style="font-size:12px; color:#aaa; margin-top:-4px;">Ganti Foto Profil:</label>
      <input type="file" id="profile-photo-input" accept="image/*" onchange="previewUploadFoto(this)" style="color:#bbb; padding: 6px;">

      <button class="modal-btn" type="button" id="btn-save-profile" onclick="simpanProfil()">Simpan Profil</button>
      <div id="auth-buttons-group" style="display: flex; gap: 8px;">
        <button class="modal-btn" type="button" style="flex:1; background:#333;" onclick="buatAkunEmail()">Daftar</button>
        <button class="modal-btn" type="button" style="flex:1; background:#444;" onclick="masukAkun()">Masuk</button>
      </div>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('auth-modal')">Tutup</button>
    </div>
  </div>

  <!-- POPUP TAMBAH SHORTS -->
  <div class="modal" id="add-modal">
    <div class="modal-box">
      <h3>Tambahkan Short Baru</h3>
      <input type="text" id="video-id-input" placeholder="Link YouTube Shorts (youtube.com/shorts/...)">
      <input type="text" id="video-channel-input" placeholder="Nama Channel (misal: @Kreator)">
      <input type="text" id="video-type-input" placeholder="Tipe video, misalnya gaming, komedi">
      <button type="button" class="modal-btn" id="btn-tambah-video" onclick="simpanShortManual()">Tambahkan</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal('add-modal')">Batal</button>
    </div>
  </div>

  <!-- FIREBASE SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-storage-compat.js"></script>

  <script>
    var currentUser = localStorage.getItem('sv_user') || 'Tamu';
    var currentPhotoURL = localStorage.getItem('sv_photo') || '';
    var videoList = JSON.parse(localStorage.getItem('sv_videos')) || [];
    var allVideoList = videoList.slice();
    var showMyVideos = false;
    var activeVideoIndex = 0;
    var autoSoundActive = false; // Flag auto-sound

    const FIREBASE_CONFIG = {
      apiKey: "AIzaSyCaXYmvDEmHFSaUd10R4acs2cHT4Ma0mwg",
      authDomain: "shortvideo-8788a.firebaseapp.com",
      projectId: "shortvideo-8788a",
      storageBucket: "shortvideo-8788a.firebasestorage.app",
      messagingSenderId: "101344146346",
      appId: "1:101344146346:web:1a46973c68993b13e4f1d3",
      measurementId: "G-E1PYNV736D"
    };

    let svDb = null, svAuth = null, svStorage = null, svFirebaseReady = false;

    function svEscape(value) { 
      return String(value || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
    }

    // Auto Aktifkan Suara saat pengguna berinteraksi pertama kali
    function aktifkanSuaraGlobal() {
      autoSoundActive = true;
      document.querySelectorAll('.short-container iframe').forEach(frame => {
        svYouTubeCommand(frame, 'unMute');
      });
      document.querySelectorAll('.btn-audio').forEach(btn => btn.style.color = '#ff0000');
    }
    window.addEventListener('click', () => { if (!autoSoundActive) aktifkanSuaraGlobal(); }, { once: true });

    function tampilkanUserBadge(name, photoURL) {
      document.getElementById('auth-btn').style.display = 'none';
      const badge = document.getElementById('user-badge');
      badge.style.display = 'flex';
      
      const photo = photoURL || currentPhotoURL;
      if (photo) {
        badge.style.backgroundImage = `url("${photo}")`;
        badge.innerText = '';
      } else {
        badge.style.backgroundImage = 'none';
        badge.innerText = (name || 'U').charAt(0).toUpperCase();
      }

      const logout = document.getElementById('logout-btn');
      if (logout) logout.style.display = 'inline-block';
    }

    if (localStorage.getItem('sv_user')) {
      tampilkanUserBadge(currentUser, currentPhotoURL);
    }

    function bukaHalaman(halaman) {
      tutupKomentar();
      if (halaman === 'main') {
        document.getElementById('page-main').style.display = 'flex';
        document.getElementById('page-shorts').style.display = 'none';
        document.getElementById('side-main').classList.add('active');
        document.getElementById('side-shorts').classList.remove('active');
        document.getElementById('side-my-videos').classList.remove('active');
        document.querySelectorAll('iframe').forEach(frame => svYouTubeCommand(frame, 'pauseVideo'));
      } else {
        if (videoList.length === 0) {
          alert('Belum ada video! Silakan tambahkan video terlebih dahulu.');
          bukaModal('add-modal');
          return;
        }
        showMyVideos = false;
        videoList = allVideoList.slice();
        document.getElementById('page-main').style.display = 'none';
        document.getElementById('page-shorts').style.display = 'block';
        document.getElementById('side-main').classList.remove('active');
        document.getElementById('side-shorts').classList.add('active');
        document.getElementById('side-my-videos').classList.remove('active');

        // Otomatis nyalakan suara dan langsung play video
        aktifkanSuaraGlobal();
        setTimeout(() => {
          const firstIframe = document.querySelector('.short-container iframe');
          if (firstIframe) {
            svYouTubeCommand(firstIframe, 'unMute');
            svYouTubeCommand(firstIframe, 'playVideo');
          }
        }, 400);
      }
    }

    function bukaModal(id) { document.getElementById(id).style.display = 'flex'; }
    function tutupModal(id) { document.getElementById(id).style.display = 'none'; }

    // Modal Akun & Edit Profil
    function bukaModalAuth() {
      bukaModal('auth-modal');
      document.getElementById('username-input').value = (currentUser !== 'Tamu') ? currentUser : '';
      const preview = document.getElementById('modal-photo-preview');
      if (currentPhotoURL) {
        preview.style.backgroundImage = `url("${currentPhotoURL}")`;
      } else {
        preview.style.backgroundImage = 'none';
      }

      if (svAuth && svAuth.currentUser && !svAuth.currentUser.isAnonymous) {
        document.getElementById('auth-fields').style.display = 'none';
        document.getElementById('auth-buttons-group').style.display = 'none';
        document.getElementById('btn-save-profile').style.display = 'block';
        document.getElementById('auth-modal-title').innerText = 'Edit Profil Saya';
      } else {
        document.getElementById('auth-fields').style.display = 'block';
        document.getElementById('auth-buttons-group').style.display = 'flex';
        document.getElementById('btn-save-profile').style.display = 'block';
        document.getElementById('auth-modal-title').innerText = 'Masuk / Buat Akun';
      }
    }

    function previewUploadFoto(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = e => {
          document.getElementById('modal-photo-preview').style.backgroundImage = `url("${e.target.result}")`;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function svYouTubeCommand(iframe, func, args=[]) {
      if (!iframe || !iframe.contentWindow) return;
      iframe.contentWindow.postMessage(JSON.stringify({event:'command', func, args}), '*');
    }

    // Render Feed Video
    function renderVideos() {
      const feed = document.getElementById('page-shorts');
      feed.innerHTML = '';

      if (videoList.length === 0) {
        document.getElementById('empty-info').innerText = 'Belum ada video tersimpan. Klik "Tambahkan Short" untuk memulai!';
        return;
      }

      document.getElementById('empty-info').innerText = `Ada ${videoList.length} video tersimpan siap ditonton!`;

      videoList.forEach((v, index) => {
        const card = document.createElement('div');
        card.className = 'short-container';
        card.dataset.index = index;

        const creatorPicStyle = v.ownerPhoto ? `background-image: url('${v.ownerPhoto}');` : '';
        const creatorPicInitial = v.ownerPhoto ? '' : svEscape((v.channel || '@Kreator').replace('@','').charAt(0).toUpperCase());

        card.innerHTML = `
          <div class="video-frame">
            ${v.ownerId && svAuth && svAuth.currentUser && v.ownerId === svAuth.currentUser.uid ? `<button class="delete-video" onclick="hapusVideo(${index}); event.stopPropagation();">Hapus</button>` : ''}
            
            <iframe 
              src="https://www.youtube.com/embed/${v.id}?enablejsapi=1&autoplay=1&mute=0&playsinline=1&controls=0&loop=1&playlist=${v.id}&rel=0" 
              allow="autoplay; accelerometer; encrypted-media; gyroscope; picture-in-picture" 
              allowfullscreen>
            </iframe>

            <div class="channel-overlay">
              <div class="channel-header">
                <div class="channel-pic" style="${creatorPicStyle}">${creatorPicInitial}</div>
                <span class="channel-name">${svEscape(v.channel)}</span>
                <button class="btn-subscribe" onclick="toggleSub(this)">Subscribe</button>
              </div>
              <div style="font-size:13px;">${svEscape(v.title || 'Shorts')}</div>
            </div>
          </div>
