<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>YouTube Shorts</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      background-color: #0f0f0f;
      color: #fff;
      font-family: "Roboto", Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ================= 1. HEADER / NAVBAR ATAS ================= */
    header {
      height: 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
      background-color: #0f0f0f;
      border-bottom: 1px solid #272727;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .menu-icon { font-size: 20px; cursor: pointer; color: #fff; }

    .yt-logo {
      display: flex;
      align-items: center;
      gap: 4px;
      font-weight: bold;
      font-size: 18px;
      letter-spacing: -0.5px;
      color: #fff;
    }

    .yt-icon {
      background-color: #ff0000;
      color: white;
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 12px;
    }

    .header-center {
      display: flex;
      align-items: center;
      width: 40%;
      max-width: 500px;
    }

    .search-box {
      width: 100%;
      padding: 8px 16px;
      border-radius: 20px 0 0 20px;
      border: 1px solid #303030;
      background: #121212;
      color: white;
      outline: none;
    }

    .search-btn {
      padding: 8px 18px;
      border-radius: 0 20px 20px 0;
      border: 1px solid #303030;
      border-left: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-create {
      background-color: #272727;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .btn-create:hover { background-color: #3f3f3f; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #7b1fa2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
    }

    /* ================= 2. LAYOUT UTAMA ================= */
    .main-layout {
      display: flex;
      flex: 1;
      height: calc(100vh - 56px);
    }

    /* Sidebar Kiri Khas YouTube */
    .sidebar {
      width: 72px;
      background-color: #0f0f0f;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 24px;
    }

    .side-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 10px;
      color: #aaa;
      cursor: pointer;
      text-decoration: none;
    }

    .side-item.active { color: #fff; font-weight: bold; }
    .side-item span.icon { font-size: 20px; }

    /* Area Konten Shorts (Snap-Scroll) */
    .shorts-feed-wrapper {
      flex: 1;
      display: flex;
      justify-content: center;
      overflow-y: scroll;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
    }
    .shorts-feed-wrapper::-webkit-scrollbar { display: none; }

    .short-container {
      width: 100%;
      max-width: 400px;
      height: calc(100vh - 56px);
      scroll-snap-align: start;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 10px 0;
    }

    .video-frame {
      width: 100%;
      height: 100%;
      max-height: 720px;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Tombol Interaksi Kanan Ala Shorts */
    .actions-bar {
      position: absolute;
      right: -60px;
      bottom: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .action-circle {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #272727;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      cursor: pointer;
      font-size: 18px;
      transition: 0.2s;
    }
    .action-circle:hover { background: #3f3f3f; transform: scale(1.1); }
    .action-label { font-size: 11px; margin-top: 4px; color: #fff; }

    /* ================= 3. POPUP TAMBAH VIDEO (+ Buat) ================= */
    #add-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background: #212121;
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-box input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #444;
      background: #121212;
      color: white;
      outline: none;
    }

    .btn-submit {
      background: #cc0000;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-submit:hover { background: #ff0000; }
  </style>
</head>
<body>

  <!-- 1. NAVBAR YOUTUBE -->
  <header>
    <div class="header-left">
      <span class="menu-icon">☰</span>
      <div class="yt-logo"><span class="yt-icon">▶</span> YouTube <sup>ID</sup></div>
    </div>
    <div class="header-center">
      <input type="text" class="search-box" placeholder="Telusuri">
      <button class="search-btn">🔍</button>
    </div>
    <div class="header-right">
      <button class="btn-create" onclick="bukaModal()"><span>＋</span> Buat</button>
      <div class="avatar">S</div>
    </div>
  </header>

  <!-- 2. LAYOUT UTAMA -->
  <div class="main-layout">
    
    <!-- Sidebar Kiri -->
    <div class="sidebar">
      <div class="side-item"><span class="icon">🏠</span>Beranda</div>
      <div class="side-item active"><span class="icon">⚡</span>Shorts</div>
      <div class="side-item"><span class="icon">📺</span>Langganan</div>
      <div class="side-item"><span class="icon">📁</span>Koleksi</div>
    </div>

    <!-- Feed Shorts (Hanya Shorts, Snap Scroll, Autoplay) -->
    <div class="shorts-feed-wrapper" id="feed-wrapper">
      
      <!-- Video 1 (Autoplay Aktif Otomatis) -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube.com/embed/jNQXAC9IVRw?autoplay=1&mute=1&loop=1&playlist=jNQXAC9IVRw&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">Suka</span>
          <div class="action-circle">👎</div>
          <div class="action-circle">💬</div>
          <span class="action-label">2.4 rb</span>
          <div class="action-circle">↗️</div>
          <span class="action-label">Bagikan</span>
        </div>
      </div>

      <!-- Video 2 -->
      <div class="short-container">
        <div class="video-frame">
          <iframe 
            src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&mute=1&loop=1&playlist=dQw4w9WgXcQ&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">Suka</span>
          <div class="action-circle">👎</div>
          <div class="action-circle">💬</div>
          <span class="action-label">18 rb</span>
          <div class="action-circle">↗️</div>
          <span class="action-label">Bagikan</span>
        </div>
      </div>

    </div>
  </div>

  <!-- 3. POPUP TAMBAH SHORTS -->
  <div id="add-modal">
    <div class="modal-box">
      <h3>Tambah YouTube Shorts Baru</h3>
      <p style="font-size: 13px; color: #aaa;">Tempel link video YouTube Shorts:</p>
      <input type="text" id="video-input" placeholder="youtube.com/shorts/KodeID...">
      <button class="btn-submit" onclick="tambahShorts()">Tambahkan ke Shorts</button>
      <button style="background:none; border:none; color:#888; cursor:pointer;" onclick="tutupModal()">Batal</button>
    </div>
  </div>

  <script>
    function bukaModal() { document.getElementById('add-modal').style.display = 'flex'; }
    function tutupModal() { document.getElementById('add-modal').style.display = 'none'; }

    function tambahShorts() {
      const input = document.getElementById('video-input').value.trim();
      if (!input) return alert('Silakan masukkan link Shorts!');

      let id = input;
      if (input.includes('shorts/')) id = input.split('shorts/')[1].split('?')[0];
      else if (input.includes('watch?v=')) id = input.split('watch?v=')[1].split('&')[0];
      else if (input.includes('youtu.be/')) id = input.split('youtu.be/')[1].split('?')[0];

      const wrapper = document.getElementById('feed-wrapper');
      const newCard = document.createElement('div');
      newCard.className = 'short-container';
      newCard.innerHTML = `
        <div class="video-frame">
          <iframe 
            src="https://www.youtube.com/embed/${id}?autoplay=1&mute=1&loop=1&playlist=${id}&rel=0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            allowfullscreen>
          </iframe>
        </div>
        <div class="actions-bar">
          <div class="action-circle" onclick="this.style.color='#ff0000'">👍</div>
          <span class="action-label">Suka</span>
          <div class="action-circle">💬</div>
          <span class="action-label">0</span>
          <div class="action-circle">↗️</div>
        </div>
      `;

      wrapper.appendChild(newCard);
      document.getElementById('video-input').value = '';
      tutupModal();
      newCard.scrollIntoView({ behavior: 'smooth' });
    }
  </script>

</body>
</html>
